                            <span class="verse-line"><span class="verse-num">22-</span>justice de Dieu par la foi en Jésus-Christ pour tous ceux qui croient. Il n'y a point de distinction.</span>
                            <span class="verse-line"><span class="verse-num">23-</span>Car tous ont péché et sont privés de la gloire de Dieu ;</span>
                            <span class="verse-line"><span class="verse-num">24-</span>et ils sont gratuitement justifiés par sa grâce, par le moyen de la rédemption qui est en Jésus-Christ.</span>
                            <span class="verse-line"><span class="verse-num">25-</span>C'est lui que Dieu a destiné à être, par son sang, une victime propitiatoire pour ceux qui croiraient, afin de montrer sa justice,</span>
                            <span class="verse-line"><span class="verse-num">26-</span>afin, dis-je, de montrer sa justice dans le temps présent, de manière à être juste tout en justifiant celui qui a la foi en Jésus.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 5:17</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Si par l'offense d'un seul la mort a régné par lui seul, à plus forte raison ceux qui reçoivent l'abondance de la grâce et du don de la justice régneront-ils dans la vie par Jésus-Christ lui seul.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 3:8-9</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Et même je regarde toutes choses comme une perte, à cause de l'excellence de la connaissance de Jésus-Christ mon Seigneur, pour lequel j'ai renoncé à tout, et je les regarde comme de la boue, afin de gagner Christ,</span>
                            <span class="verse-line"><span class="verse-num">9-</span>et d'être trouvé en lui, non avec ma justice, celle qui vient de la loi, mais avec celle qui s'obtient par la foi en Christ, la justice qui vient de Dieu par la foi.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que ma justice ne vient pas de mes œuvres, mais de Jésus-Christ. Par la foi, tu m'as déclaré juste. Je ne vis plus sous la condamnation. Je suis revêtu de la justice de Christ. Je peux m'approcher de toi avec assurance.",
                    declaration: "Je déclare que je suis accepté devant Dieu grâce à l'œuvre parfaite de Jésus. Je refuse toute accusation qui contredit ta Parole. Je marche dans la justice, l'intégrité et la sainteté. Je reflète la justice de Christ dans mes pensées, mes paroles et mes actions.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que toute condamnation est annulée. Je proclame que le sang de Jésus parle en ma faveur. Je proclame que je tiens ferme devant Dieu, revêtu de la justice de Christ. Je marche avec assurance dans la présence du Père.",
                    priere: "Père céleste, Merci parce que tu m'as justifié gratuitement par ta grâce. Aide-moi à vivre d'une manière digne de cette justice. Que ma conduite glorifie ton nom. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse d'essayer de mériter l'amour de Dieu. Je vis dans la reconnaissance pour la justice que Christ m'a donnée."
                },
                "THÈME 15 — JE SUIS SAINT ET BIEN-AIMÉ": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 3:12</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Ainsi donc, comme des élus de Dieu, saints et bien-aimés, revêtez-vous d'entrailles de miséricorde, de bonté, d'humilité, de douceur, de patience.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 1:4</span>
                            <span class="verse-line"><span class="verse-num">4-</span>En lui Dieu nous a élus avant la fondation du monde, pour que nous soyons saints et irrépréhensibles devant lui,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 1:15-16</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Mais, puisque celui qui vous a appelés est saint, vous aussi soyez saints dans toute votre conduite,</span>
                            <span class="verse-line"><span class="verse-num">16-</span>selon qu'il est écrit : Vous serez saints, car je suis saint.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 1:7</span>
                            <span class="verse-line"><span class="verse-num">7-</span>à tous ceux qui, à Rome, sont bien-aimés de Dieu, appelés à être saints : que la grâce et la paix vous soient données de la part de Dieu notre Père et du Seigneur Jésus-Christ !</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jude 1</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Jude, serviteur de Jésus-Christ, et frère de Jacques, à ceux qui ont été appelés, qui sont aimés en Dieu le Père, et gardés pour Jésus-Christ :</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as mis à part pour toi. Je suis ton enfant bien-aimé. Tu m'appelles à vivre dans la sainteté. Je crois que ton Esprit me sanctifie chaque jour. Je désire te ressembler dans toutes mes pensées et dans toutes mes actions.",
                    declaration: "Je déclare que je marche dans la sainteté. Je rejette toute souillure du péché. Je revêts la compassion, la bonté, l'humilité, la douceur et la patience. Je manifeste l'amour de Dieu autour de moi.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que je suis consacré au Seigneur. Je proclame que le péché ne dominera pas sur moi. Je proclame que ma vie glorifie Dieu. Je marche dans la lumière de Christ.",
                    priere: "Père céleste, Merci de m'avoir appelé à être saint. Continue ton œuvre de purification en moi. Donne-moi un cœur sensible à ta voix. Que ma vie soit un témoignage vivant de ton amour. Amen.",
                    progression: "Je comprends que la sainteté n'est pas un poids, mais le fruit d'une communion vivante avec Dieu."
                },
                "THÈME 16 — JE SUIS CHOISI PAR DIEU": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Jean 15:16</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Ce n'est pas vous qui m'avez choisi ; mais moi, je vous ai choisis, et je vous ai établis, afin que vous alliez, et que vous portiez du fruit, et que votre fruit demeure, afin que ce que vous demanderez au Père en mon nom, il vous le donne.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 1:4-5</span>
                            <span class="verse-line"><span class="verse-num">4-</span>En lui Dieu nous a élus avant la fondation du monde, pour que nous soyons saints et irrépréhensibles devant lui,</span>
                            <span class="verse-line"><span class="verse-num">5-</span>nous ayant prédestinés dans son amour à être ses enfants d'adoption par Jésus-Christ, selon le bon plaisir de sa volonté,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 2:9</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Vous, au contraire, vous êtes une race élue, un sacerdoce royal, une nation sainte, un peuple acquis, afin d'annoncer les vertus de celui qui vous a appelés des ténèbres à son admirable lumière.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 3:12</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Ainsi donc, comme des élus de Dieu, saints et bien-aimés, revêtez-vous d'entrailles de miséricorde, de bonté, d'humilité, de douceur, de patience.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Thessaloniciens 2:13</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Pour nous, frères bien-aimés du Seigneur, nous devons à votre sujet rendre continuellement grâces à Dieu, parce que Dieu vous a choisis dès le commencement pour le salut, par la sanctification de l'Esprit et par la foi en la vérité.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as choisi par amour. Tu m'as appelé avant même que je puisse te chercher. Tu m'as mis à part pour accomplir les œuvres que tu as préparées d'avance. Je crois que ma vie a un but dans ton Royaume.",
                    declaration: "Je déclare que je ne suis ni oublié ni rejeté. Je suis choisi par Dieu. Je marche dans la vocation qu'il a préparée pour moi. Je refuse le découragement et le sentiment d'inutilité. Je porte du fruit pour sa gloire.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que les projets de Dieu s'accompliront dans ma vie. Je proclame qu'aucune opposition ne pourra empêcher l'appel de Dieu. Je proclame que le Seigneur ouvre les portes qu'il a préparées pour moi.",
                    priere: "Père céleste, Merci de m'avoir choisi. Donne-moi de marcher fidèlement dans l'appel que tu m'as confié. Rends-moi disponible pour accomplir ta volonté. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse de comparer ma vie à celle des autres. Je découvre avec joie la vocation particulière que Dieu m'a confiée."
                },
                "THÈME 17 — JE SUIS ADOPTÉ PAR LE PÈRE": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:15-17</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Et vous n'avez point reçu un esprit de servitude, pour être encore dans la crainte ; mais vous avez reçu un Esprit d'adoption, par lequel nous crions : Abba ! Père !</span>
                            <span class="verse-line"><span class="verse-num">16-</span>L'Esprit lui-même rend témoignage à notre esprit que nous sommes enfants de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Or, si nous sommes enfants, nous sommes aussi héritiers : héritiers de Dieu, et cohéritiers de Christ, si toutefois nous souffrons avec lui, afin d'être glorifiés avec lui.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Galates 4:4-7</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Mais, lorsque les temps ont été accomplis, Dieu a envoyé son Fils, né d'une femme, né sous la loi,</span>
                            <span class="verse-line"><span class="verse-num">5-</span>afin qu'il rachetât ceux qui étaient sous la loi, afin que nous reçussions l'adoption.</span>
                            <span class="verse-line"><span class="verse-num">6-</span>Et parce que vous êtes fils, Dieu a envoyé dans nos cœurs l'Esprit de son Fils, lequel crie : Abba ! Père !</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Ainsi tu n'es plus esclave, mais fils ; et si tu es fils, tu es aussi héritier par la grâce de Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 1:5</span>
                            <span class="verse-line"><span class="verse-num">5-</span>nous ayant prédestinés dans son amour à être ses enfants d'adoption par Jésus-Christ, selon le bon plaisir de sa volonté,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 1:12</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Mais à tous ceux qui l'ont reçue, à ceux qui croient en son nom, elle a donné le pouvoir de devenir enfants de Dieu,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Jean 3:1</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Voyez quel amour le Père nous a témoigné, pour que nous soyons appelés enfants de Dieu ! Et nous le sommes. Si le monde ne nous connaît pas, c'est qu'il ne l'a pas connu.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as adopté en Jésus-Christ. Je ne suis plus un étranger. Je fais partie de ta famille. Je peux t'appeler avec confiance : « Abba, Père ». Je reçois ton amour, ton héritage et ta discipline avec reconnaissance.",
                    declaration: "Je déclare que je vis dans la sécurité de l'amour du Père. Je refuse tout esprit d'esclavage, de rejet ou d'abandon. Je marche dans la liberté et la dignité d'un enfant adopté par Dieu. Je reflète le caractère de mon Père céleste.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que je suis pleinement accueilli dans la famille de Dieu. Je proclame que toute accusation qui prétend que je suis abandonné est réduite au silence. Je proclame que le Père veille sur moi, me conduit et me garde. Je demeure dans son amour.",
                    priere: "Père céleste, Merci de m'avoir adopté par Jésus-Christ. Apprends-moi à vivre chaque jour dans la confiance envers toi. Que je connaisse toujours davantage ton cœur de Père. Fais de moi un reflet fidèle de ton amour.",
                    progression: "Je cesse de vivre comme un serviteur qui craint d'être rejeté. J'apprends à vivre comme un fils aimé, accueilli et établi dans la maison du Père."
                },
                "THÈME 18 — JE SUIS HÉRITIER DE DIEU ET COHÉRITIER AVEC CHRIST": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:16-17</span>
                            <span class="verse-line"><span class="verse-num">16-</span>L'Esprit lui-même rend témoignage à notre esprit que nous sommes enfants de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Or, si nous sommes enfants, nous sommes aussi héritiers : héritiers de Dieu, et cohéritiers de Christ, si toutefois nous souffrons avec lui, afin d'être glorifiés avec lui.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Galates 4:6-7</span>
                            <span class="verse-line"><span class="verse-num">6-</span>Et parce que vous êtes fils, Dieu a envoyé dans nos cœurs l'Esprit de son Fils, lequel crie : Abba ! Père !</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Ainsi tu n'es plus esclave, mais fils ; et si tu es fils, tu es aussi héritier par la grâce de Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 1:11-14</span>
                            <span class="verse-line"><span class="verse-num">11-</span>En lui nous sommes aussi devenus héritiers, ayant été prédestinés suivant la résolution de celui qui opère toutes choses d'après le conseil de sa volonté,</span>
                            <span class="verse-line"><span class="verse-num">12-</span>afin que nous servions à la louange de sa gloire, nous qui d'avance avons espéré en Christ.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>En lui vous aussi, après avoir entendu la parole de la vérité, l'Évangile de votre salut, en lui vous avez cru et vous avez été scellés du Saint-Esprit qui avait été promis,</span>
                            <span class="verse-line"><span class="verse-num">14-</span>lequel est un gage de notre héritage, pour la rédemption de ceux que Dieu s'est acquis, à la louange de sa gloire.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 1:3-4</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Béni soit Dieu, le Père de notre Seigneur Jésus-Christ, qui, selon sa grande miséricorde, nous a régénérés, pour une espérance vivante, par la résurrection de Jésus-Christ d'entre les morts,</span>
                            <span class="verse-line"><span class="verse-num">4-</span>pour un héritage qui ne se peut ni corrompre, ni souiller, ni flétrir, lequel vous est réservé dans les cieux,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Tite 3:7</span>
                            <span class="verse-line"><span class="verse-num">7-</span>afin que, justifiés par sa grâce, nous devenions, en espérance, héritiers de la vie éternelle.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que je suis ton enfant et que, par Jésus-Christ, je suis devenu héritier de tes promesses. Je ne suis pas privé de ton héritage, car tu m'as donné accès aux richesses de ta grâce. Je confesse que mon héritage ne dépend pas des richesses de ce monde, mais de ce que tu as préparé pour ceux qui t'appartiennent. Je suis cohéritier avec Christ.",
                    declaration: "Je déclare que je marche dans l'héritage que Dieu m'a donné. Je déclare que je reçois les bénédictions spirituelles qui sont en Christ. Je ne vis pas comme quelqu'un abandonné ou dépourvu, mais comme un enfant du Roi. Je déclare que la grâce, la paix, la sagesse et la présence de Dieu sont mon héritage quotidien.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que je suis héritier de Dieu. Je proclame que toutes les promesses divines m'appartiennent en Christ. Je proclame que les bénédictions spirituelles et la vie éternelle sont mon héritage. Je proclame que rien ne pourra me voler ce que Dieu a préparé pour moi.",
                    priere: "Père céleste, Merci parce que tu m'as adopté et que tu m'as donné un héritage éternel. Aide-moi à vivre dans la réalité de ce que tu as préparé pour moi. Que je ne cherche pas seulement tes bénédictions, mais que je désire avant tout ta présence. Apprends-moi à être un bon administrateur de ce que tu me confies. Au nom de Jésus-Christ. Amen.",
                    progression: "Je passe d'une mentalité de manque à une conscience d'héritier. Je découvre que ma véritable richesse se trouve en Dieu et dans ma relation avec Christ."
                },
                "THÈME 19 — MA CITOYENNETÉ EST DANS LE CIEL": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 3:20</span>
                            <span class="verse-line"><span class="verse-num">20-</span>Mais notre cité à nous est dans les cieux, d'où nous attendons aussi comme Sauveur le Seigneur Jésus-Christ,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 2:19</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Ainsi donc, vous n'êtes plus des étrangers, ni des gens du dehors ; mais vous êtes concitoyens des saints, gens de la maison de Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 12:22-24</span>
                            <span class="verse-line"><span class="verse-num">22-</span>Mais vous vous êtes approchés de la montagne de Sion, de la cité du Dieu vivant, la Jérusalem céleste, des myriades qui forment le chœur des anges,</span>
                            <span class="verse-line"><span class="verse-num">23-</span>de l'assemblée des premiers-nés inscrits dans les cieux, du juge qui est le Dieu de tous, des esprits des justes parvenus à la perfection,</span>
                            <span class="verse-line"><span class="verse-num">24-</span>de Jésus qui est le médiateur de la nouvelle alliance, et du sang de l'aspersion qui parle mieux que celui d'Abel.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 3:1-2</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Si donc vous êtes ressuscités avec Christ, cherchez les choses d'en haut, où Christ est assis à la droite de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Affectionnez-vous aux choses d'en haut, et non à celles qui sont sur la terre.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 14:1-3</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Que votre cœur ne se trouble point. Croyez en Dieu, et croyez en moi.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Il y a plusieurs demeures dans la maison de mon Père. Si cela n'était pas, je vous l'aurais dit. Je vais vous préparer une place.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Et, lorsque je m'en serai allé, et que je vous aurai préparé une place, je reviendrai, et je vous prendrai avec moi, afin que là où je suis vous y soyez aussi.</span>
                        </div>
                    `,
                    confession: "Père céleste. Je confesse que ma véritable citoyenneté est dans les cieux. Je suis un étranger sur cette terre, appelé à représenter ton Royaume. Je ne suis pas limité aux réalités visibles, car mon espérance est éternelle. Je crois que ma destinée finale est auprès de toi avec Jésus-Christ.",
                    declaration: "Je déclare que mes pensées sont tournées vers les réalités célestes. Je refuse de vivre uniquement selon les valeurs de ce monde. Je marche comme un ambassadeur du Royaume de Dieu. Mes paroles, mes choix et mon comportement reflètent mon appartenance au ciel.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que mon identité première est en Dieu. Je proclame que les ténèbres de ce monde ne définiront pas ma destinée. Je proclame que je représente le Royaume de Dieu partout où je vais. Je proclame que mon avenir est assuré en Christ.",
                    priere: "Père céleste, Merci parce que tu as préparé pour moi une demeure éternelle. Aide-moi à vivre sur cette terre avec une vision du ciel. Que mes actions témoignent de ton Royaume. Fais de moi un fidèle représentant de Jésus-Christ. Amen.",
                    progression: "Je cesse d'être attaché uniquement aux choses temporaires. Je développe une perspective éternelle dans ma manière de vivre."
                }
            },
            // ============================================================
            // PARTIE III — LE SANG, LA CROIX ET LE RACHAT (Thèmes 20 à 28)
            // ============================================================
            "PARTIE III — LE SANG, LA CROIX ET LE RACHAT": {
                "THÈME 20 — LE SANG DE JÉSUS ME RACHÈTE": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 1:18-19</span>
                            <span class="verse-line"><span class="verse-num">18-</span>sachant que ce n'est pas par des choses périssables, par de l'argent ou de l'or, que vous avez été rachetés de la vaine manière de vivre que vous aviez héritée de vos pères,</span>
                            <span class="verse-line"><span class="verse-num">19-</span>mais par le sang précieux de Christ, comme d'un agneau sans défaut et sans tache,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 1:7</span>
                            <span class="verse-line"><span class="verse-num">7-</span>En lui nous avons la rédemption par son sang, la rémission des péchés, selon la richesse de sa grâce,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Apocalypse 5:9</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Et ils chantaient un cantique nouveau, en disant : Tu es digne de prendre le livre, et d'en ouvrir les sceaux ; car tu as été immolé, et tu as racheté pour Dieu par ton sang des hommes de toute tribu, de toute langue, de tout peuple, et de toute nation ;</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Actes 20:28</span>
                            <span class="verse-line"><span class="verse-num">28-</span>Prenez donc garde à vous-mêmes, et à tout le troupeau sur lequel le Saint-Esprit vous a établis évêques, pour paître l'Église du Seigneur, qu'il s'est acquise par son propre sang.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 9:12</span>
                            <span class="verse-line"><span class="verse-num">12-</span>et il est entré une fois pour toutes dans le lieu très saint, non avec le sang des boucs et des veaux, mais avec son propre sang, ayant obtenu une rédemption éternelle.</span>
                        </div>
                    `,
                    confession: "Père céleste. Je confesse que j'ai été racheté par le sang précieux de Jésus-Christ. Je n'appartiens plus au péché ni aux ténèbres. Le prix de mon rachat a été payé parfaitement par le sacrifice de ton Fils. Je crois que le sang de Jésus a une valeur éternelle et qu'il m'a acquis pour Dieu.",
                    declaration: "Je déclare que je suis racheté, restauré et appartenant à Dieu. Je déclare que mon esprit, mon âme et mon corps appartiennent au Seigneur. Je ne suis plus esclave du passé. Je marche dans la liberté que Jésus a obtenue pour moi.",
                    proclamation: "Au nom puissant de Jésus-Christ, Je proclame que le sang de Jésus a annulé toute dette spirituelle contre moi. Je proclame que toute accusation perd son pouvoir devant l'œuvre parfaite de la croix. Je proclame que j'appartiens à Jésus-Christ. Je proclame que ma vie est consacrée au Seigneur.",
                    priere: "Seigneur Jésus. Merci pour ton sang versé pour mon salut. Merci parce que tu m'as racheté à un prix immense. Aide-moi à vivre comme une personne appartenant totalement à Dieu. Que ma vie honore le sacrifice que tu as accompli pour moi. Amen.",
                    progression: "Je passe d'une conscience de culpabilité à une conscience de rachat. Je découvre la valeur que Dieu m'accorde à travers le sacrifice de Jésus."
                },
                "THÈME 21 — LE SANG DE JÉSUS ME PURIFIE": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">1 Jean 1:7</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Mais si nous marchons dans la lumière, comme il est lui-même dans la lumière, nous sommes mutuellement en communion, et le sang de Jésus son Fils nous purifie de tout péché.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 9:14</span>
                            <span class="verse-line"><span class="verse-num">14-</span>combien plus le sang de Christ, qui, par un esprit éternel, s'est offert lui-même sans tache à Dieu, purifiera-t-il votre conscience des œuvres mortes, afin que vous serviez le Dieu vivant !</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 10:19-22</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Ainsi donc, frères, puisque nous avons, au moyen du sang de Jésus, une libre entrée dans le sanctuaire</span>
                            <span class="verse-line"><span class="verse-num">20-</span>par la route nouvelle et vivante qu'il a inaugurée pour nous au travers du voile, c'est-à-dire, de sa chair,</span>
                            <span class="verse-line"><span class="verse-num">21-</span>et puisque nous avons un souverain sacrificateur établi sur la maison de Dieu,</span>
                            <span class="verse-line"><span class="verse-num">22-</span>approchons-nous avec un coeur sincère, dans la plénitude de la foi, les coeurs purifiés d'une mauvaise conscience, et le corps lavé d'une eau pure.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Apocalypse 1:5</span>
                            <span class="verse-line"><span class="verse-num">5-</span>et de la part de Jésus-Christ, le témoin fidèle, le premier-né des morts, et le prince des rois de la terre ! À celui qui nous aime, qui nous a délivrés de nos péchés par son sang,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 5:25-27</span>
                            <span class="verse-line"><span class="verse-num">25-</span>Maris, aimez vos femmes, comme Christ a aimé l'Église, et s'est livré lui-même pour elle,</span>
                            <span class="verse-line"><span class="verse-num">26-</span>afin de la sanctifier par la parole, après l'avoir purifiée par le baptême d'eau,</span>
                            <span class="verse-line"><span class="verse-num">27-</span>afin de faire paraître devant lui cette Église glorieuse, sans tache, ni ride, ni rien de semblable, mais sainte et irrépréhensible.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que le sang de Jésus me purifie de tout péché. Je ne suis pas seulement pardonné extérieurement, mais ma conscience est purifiée devant toi. Je crois que le sacrifice de Jésus est suffisant pour me rendre libre et m'approcher de ta présence.",
                    declaration: "Je déclare que je suis lavé par le sang de Jésus. Je déclare que la honte, la culpabilité et la condamnation n'ont plus de pouvoir sur moi. Je marche dans la lumière de Dieu. Je vis dans la pureté que Christ produit en moi.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute souillure du passé est effacée par le sang de Jésus. Je proclame que toute accusation de l'ennemi est vaincue. Je proclame que ma conscience est libérée pour servir le Dieu vivant. Je marche dans la sainteté et la liberté.",
                    priere: "Père céleste. Merci pour le sang précieux de Jésus. Merci parce que tu m'as purifié et restauré. Aide-moi à demeurer dans ta lumière. Que ma vie reflète la pureté et l'amour de Christ. Amen.",
                    progression: "Je ne vis plus dans la culpabilité du passé. Je vis dans la grâce, la purification et la communion avec Dieu."
                },
                "THÈME 22 — LE SANG DE JÉSUS PARLE EN MA FAVEUR": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 12:24</span>
                            <span class="verse-line"><span class="verse-num">24-</span>de Jésus qui est le médiateur de la nouvelle alliance, et du sang de l'aspersion qui parle mieux que celui d'Abel.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:33-34</span>
                            <span class="verse-line"><span class="verse-num">33-</span>Qui accusera les élus de Dieu? C'est Dieu qui justifie!</span>
                            <span class="verse-line"><span class="verse-num">34-</span>Qui les condamnera? Christ est mort; bien plus, il est ressuscité, il est à la droite de Dieu, et il intercède pour nous!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Apocalypse 12:10-11</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Et j'entendis dans le ciel une voix forte qui disait : Maintenant le salut est arrivé, et la puissance, et le règne de notre Dieu, et l'autorité de son Christ ; car il a été précipité, l'accusateur de nos frères, celui qui les accusait devant notre Dieu jour et nuit.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Ils l'ont vaincu à cause du sang de l'agneau et à cause de la parole de leur témoignage, et ils n'ont pas aimé leur vie jusqu'à craindre la mort.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que le sang de Jésus parle en ma faveur. Je crois que l'œuvre accomplie par Jésus à la croix est plus puissante que toute accusation.",
                    declaration: "Je déclare que la voix du sang de Jésus est plus forte que la voix de la condamnation. Je déclare que mes fautes ne sont pas mon identité. Je déclare que Dieu me voit à travers l'œuvre parfaite de Christ. Je marche dans la grâce, la confiance et l'assurance devant Dieu.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute accusation de l'ennemi est réduite au silence. Je proclame que le sang de Jésus témoigne de mon pardon, de ma restauration et de mon appartenance à Dieu. Je proclame que je suis justifié par la grâce de Dieu. Je proclame que rien ne peut m'arracher de la main du Seigneur.",
                    priere: "Père céleste. Merci parce que Jésus est mon avocat et mon intercesseur. Merci parce que son sang parle mieux que mes erreurs. Aide-moi à vivre dans la vérité de ton pardon. Que je marche toujours avec un cœur humble et reconnaissant. Au nom de Jésus-Christ. Amen.",
                    progression: "Je quitte une vie dominée par la culpabilité pour entrer dans une vie fondée sur la grâce. Je comprends que mon assurance vient de Christ et non de ma perfection personnelle."
                },
                "THÈME 23 — JE VAINCS PAR LE SANG DE JÉSUS": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Apocalypse 12:11</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Ils l'ont vaincu à cause du sang de l'agneau et à cause de la parole de leur témoignage, et ils n'ont pas aimé leur vie jusqu'à craindre la mort.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 2:15</span>
                            <span class="verse-line"><span class="verse-num">15-</span>il a dépouillé les dominations et les autorités, et les a livrées publiquement en spectacle, en triomphant d'elles par la croix.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 2:14-15</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Ainsi donc, puisque les enfants participent au sang et à la chair, il y a également participé lui-même, afin que, par la mort, il anéantît celui qui a la puissance de la mort, c'est-à-dire le diable,</span>
                            <span class="verse-line"><span class="verse-num">15-</span>et qu'il délivrât tous ceux qui, par crainte de la mort, étaient toute leur vie retenus dans la servitude.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Luc 10:19</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Voici, je vous ai donné le pouvoir de marcher sur les serpents et les scorpions, et sur toute la puissance de l'ennemi; et rien ne pourra vous nuire.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:37</span>
                            <span class="verse-line"><span class="verse-num">37-</span>Mais dans toutes ces choses nous sommes plus que vainqueurs par celui qui nous a aimés.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que la victoire appartient à Jésus-Christ. Par son sang versé et son sacrifice parfait, il a vaincu les puissances des ténèbres. Je crois que je participe à sa victoire parce que je lui appartiens. Je ne combats pas seul : Christ combat avec moi et pour moi.",
                    declaration: "Je déclare que je suis victorieux en Jésus-Christ. Je déclare que le sang de Jésus me rappelle mon alliance avec Dieu. Je refuse la peur, le découragement et l'intimidation. Je marche dans la victoire de la croix.",
                    proclamation: "Au nom puissant de Jésus-Christ. Je proclame que les œuvres des ténèbres sont vaincues par l'autorité de Jésus. Je proclame que toute oppression qui s'oppose à la volonté de Dieu doit reculer. Je proclame que je suis plus que vainqueur par celui qui m'a aimé. Je proclame que la victoire de Christ se manifeste dans ma vie.",
                    priere: "Seigneur Jésus. Merci pour ta victoire obtenue à la croix. Merci parce que tu as dépouillé les puissances ennemies. Apprends-moi à marcher chaque jour dans cette victoire. Donne-moi une foi ferme et un cœur rempli de confiance. Amen.",
                    progression: "Je cesse de vivre comme une victime. Je découvre que je suis appelé à vivre dans la victoire acquise par Jésus-Christ."
                },
                "THÈME 24 — LE SANG DE JÉSUS ME SANCTIFIE": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 13:12</span>
                            <span class="verse-line"><span class="verse-num">12-</span>C'est pour cela que Jésus aussi, afin de sanctifier le peuple par son propre sang, a souffert hors de la porte.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 10:10</span>
                            <span class="verse-line"><span class="verse-num">10-</span>C'est en vertu de cette volonté que nous sommes sanctifiés, par l'offrande du corps de Jésus-Christ, une fois pour toutes.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Corinthiens 6:11</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Et c'est là ce que vous étiez, quelques-uns de vous. Mais vous avez été lavés, mais vous avez été sanctifiés, mais vous avez été justifiés au nom du Seigneur Jésus Christ, et par l'Esprit de notre Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 1:2</span>
                            <span class="verse-line"><span class="verse-num">2-</span>et qui sont élus selon la prescience de Dieu le Père, par la sanctification de l'Esprit, afin qu'ils deviennent obéissants, et qu'ils participent à l'aspersion du sang de Jésus Christ: que la grâce et la paix vous soient multipliées!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 6:19</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Je parle à la manière des hommes, à cause de la faiblesse de votre chair. -De même donc que vous avez livré vos membres comme esclaves à l'impureté et à l'iniquité, pour arriver à l'iniquité, ainsi maintenant livrez vos membres comme esclaves à la justice, pour arriver à la sainteté.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que je suis sanctifié par le sang de Jésus-Christ. Je suis mis à part pour toi. Je reconnais que ma sainteté ne vient pas seulement de mes efforts, mais de l'œuvre de Christ et de l'action du Saint-Esprit. Je suis appelé à refléter ton caractère.",
                    declaration: "Je déclare que ma vie appartient au Seigneur. Je déclare que mes pensées, mes paroles et mes actions sont consacrées à Dieu. Je rejette ce qui m'éloigne de sa volonté. Je marche dans la pureté, l'amour et l'obéissance.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que le sang de Jésus me sépare des œuvres des ténèbres. Je proclame que toute souillure perd son pouvoir sur moi. Je proclame que le Saint-Esprit me transforme jour après jour. Je proclame que ma vie glorifie Dieu.",
                    priere: "Père céleste. Merci parce que Jésus m'a sanctifié par son sacrifice. Purifie continuellement mon cœur. Aide-moi à vivre d'une manière digne de mon appel. Que ma vie soit un témoignage de ta sainteté. Amen.",
                    progression: "Je comprends que la sainteté n'est pas seulement éviter le mal, mais appartenir entièrement à Dieu. Je progresse dans une vie consacrée à Christ."
                },
                "THÈME 25 — LA CROIX DE CHRIST A ANNULÉ MA CONDAMNATION": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 2:13-15</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Vous qui étiez morts par vos offenses et par l'incirconcision de votre chair, il vous a rendus à la vie avec lui, en nous faisant grâce pour toutes nos offenses ;</span>
                            <span class="verse-line"><span class="verse-num">14-</span>il a effacé l'acte dont les ordonnances nous condamnaient et qui subsistait contre nous, et il l'a détruit en le clouant à la croix ;</span>
                            <span class="verse-line"><span class="verse-num">15-</span>il a dépouillé les dominations et les autorités, et les a livrées publiquement en spectacle, en triomphant d'elles par la croix.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:1</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Il n'y a donc maintenant aucune condamnation pour ceux qui sont en Jésus-Christ.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Galates 3:13</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Christ nous a rachetés de la malédiction de la loi, étant devenu malédiction pour nous-car il est écrit: Maudit est quiconque est pendu au bois, -</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 53:5</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Mais il était blessé pour nos péchés, Brisé pour nos iniquités; Le châtiment qui nous donne la paix est tombé sur lui, Et c'est par ses meurtrissures que nous sommes guéris.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 19:30</span>
                            <span class="verse-line"><span class="verse-num">30-</span>Quand Jésus eut pris le vinaigre, il dit: Tout est accompli. Et, baissant la tête, il rendit l'esprit.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que Jésus-Christ a porté ma condamnation à la croix. L'acte qui me condamnait a été effacé par son sacrifice. Je ne suis plus sous le jugement, mais sous la grâce. Je crois que Jésus a payé entièrement le prix de mon salut.",
                    declaration: "Je déclare que je suis libre de toute condamnation. Je déclare que l'œuvre de la croix est parfaite et suffisante. Je déclare que la justice de Dieu m'a été donnée gratuitement en Jésus-Christ. Je marche dans la liberté des enfants de Dieu.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que toute accusation contraire à l'œuvre de la croix est annulée. Je proclame que toute culpabilité qui m'empêche d'avancer est brisée. Je proclame que Jésus a remporté la victoire sur le péché et les puissances ennemies. Je marche dans la liberté des enfants de Dieu.",
                    priere: "Seigneur Jésus, Merci pour la croix. Merci d'avoir porté ce que je ne pouvais pas porter. Merci d'avoir pris ma condamnation afin de me donner ta vie. Aide-moi à vivre chaque jour dans la réalité de ton sacrifice. Que ma vie soit une réponse d'amour et de reconnaissance envers toi. Amen.",
                    progression: "Je passe de la culpabilité à la liberté. Je ne regarde plus seulement ce dont j'ai été délivré, mais ce à quoi Christ m'appelle désormais."
                },
                "THÈME 26 — MON VIEIL HOMME A ÉTÉ CRUCIFIÉ AVEC CHRIST": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Romains 6:6-7</span>
                            <span class="verse-line"><span class="verse-num">6-</span>sachant que notre vieil homme a été crucifié avec lui, afin que le corps du péché fût détruit, pour que nous ne soyons plus esclaves du péché;</span>
                            <span class="verse-line"><span class="verse-num">7-</span>car celui qui est mort est libre du péché.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Galates 2:20</span>
                            <span class="verse-line"><span class="verse-num">20-</span>J'ai été crucifié avec Christ ; et si je vis, ce n'est plus moi qui vis, c'est Christ qui vit en moi ; si je vis maintenant dans la chair, je vis dans la foi au Fils de Dieu, qui m'a aimé et qui s'est livré lui-même pour moi.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Galates 5:24</span>
                            <span class="verse-line"><span class="verse-num">24-</span>Ceux qui sont à Jésus Christ ont crucifié la chair avec ses passions et ses désirs.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 4:22-24</span>
                            <span class="verse-line"><span class="verse-num">22-</span>à dépouiller votre ancienne manière de vivre, l'ancien homme qui se corrompt par les convoitises trompeuses,</span>
                            <span class="verse-line"><span class="verse-num">23-</span>à être renouvelés dans l'esprit de votre intelligence,</span>
                            <span class="verse-line"><span class="verse-num">24-</span>et à revêtir l'homme nouveau, créé selon Dieu dans une justice et une sainteté que produit la vérité.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 3:3-10</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Car vous êtes morts, et votre vie est cachée avec Christ en Dieu.</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Quand Christ, votre vie, paraîtra, alors vous paraîtrez aussi avec lui dans la gloire.</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Faites donc mourir les membres qui sont sur la terre, l'impudicité, l'impureté, les passions, les mauvais désirs, et la cupidité, qui est une idolâtrie.</span>
                            <span class="verse-line"><span class="verse-num">6-</span>C'est à cause de ces choses que la colère de Dieu vient sur les fils de la rébellion,</span>
                            <span class="verse-line"><span class="verse-num">7-</span>parmi lesquels vous marchiez autrefois, lorsque vous viviez dans ces péchés.</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Mais maintenant, renoncez à toutes ces choses, à la colère, à l'animosité, à la méchanceté, à la calomnie, aux paroles déshonnêtes qui pourraient sortir de votre bouche.</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Ne mentez pas les uns aux autres, vous étant dépouillés du vieil homme et de ses oeuvres,</span>
                            <span class="verse-line"><span class="verse-num">10-</span>et ayant revêtu l'homme nouveau, qui se renouvelle, dans la connaissance, selon l'image de celui qui l'a créé.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que mon vieil homme a été crucifié avec Christ. Je crois que Jésus a mis fin à la domination de mon ancienne nature. Je ne suis plus esclave du péché ni prisonnier de mes anciennes habitudes.",
                    declaration: "Je déclare que mon ancienne nature n'est plus mon maître. Je déclare que je suis une nouvelle personne en Jésus-Christ. Je renonce aux anciennes pensées, aux anciennes pratiques et aux anciens désirs qui ne glorifient pas Dieu. Je revêts l'homme nouveau créé selon Dieu dans la justice et la sainteté.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que le péché n'a plus de pouvoir absolu sur ma vie. Je proclame que les anciennes chaînes sont brisées par la puissance de la croix. Je proclame que ma liberté en Christ est une réalité spirituelle. Je proclame que je marche dans la victoire de Jésus ressuscité.",
                    priere: "Seigneur Jésus, Merci parce que tu as porté mon ancienne vie à la croix. Aide-moi à ne pas retourner à ce que tu as vaincu. Renouvelle mon intelligence et transforme mes désirs. Que ma vie manifeste toujours davantage ta nature. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse de lutter pour changer uniquement par mes propres forces. Je m'appuie sur l'œuvre accomplie par Christ et je laisse le Saint-Esprit transformer ma vie."
                },
                "THÈME 27 — JE SUIS MORT AU PÉCHÉ ET VIVANT POUR DIEU": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Romains 6:8-14</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Or, si nous sommes morts avec Christ, nous croyons que nous vivrons aussi avec lui,</span>
                            <span class="verse-line"><span class="verse-num">9-</span>sachant que Christ ressuscité des morts ne meurt plus; la mort n'a plus de pouvoir sur lui.</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Car il est mort, et c'est pour le péché qu'il est mort une fois pour toutes; il est revenu à la vie, et c'est pour Dieu qu'il vit.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Ainsi vous-mêmes, regardez-vous comme morts au péché, et comme vivants pour Dieu en Jésus Christ.</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Que le péché ne règne donc point dans votre corps mortel, et n'obéissez pas à ses convoitises.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Ne livrez pas vos membres au péché, comme des instruments d'iniquité; mais donnez-vous vous-mêmes à Dieu, comme étant vivants de morts que vous étiez, et offrez à Dieu vos membres, comme des instruments de justice.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Car le péché n'aura point de pouvoir sur vous, puisque vous êtes, non sous la loi, mais sous la grâce.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 6:22-23</span>
                            <span class="verse-line"><span class="verse-num">22-</span>Mais maintenant, étant affranchis du péché et devenus esclaves de Dieu, vous avez pour fruit la sainteté et pour fin la vie éternelle.</span>
                            <span class="verse-line"><span class="verse-num">23-</span>Car le salaire du péché, c'est la mort; mais le don gratuit de Dieu, c'est la vie éternelle en Jésus Christ notre Seigneur.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 3:1-5</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Si donc vous êtes ressuscités avec Christ, cherchez les choses d'en haut, où Christ est assis à la droite de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Affectionnez-vous aux choses d'en haut, et non à celles qui sont sur la terre.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Car vous êtes morts, et votre vie est cachée avec Christ en Dieu.</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Quand Christ, votre vie, paraîtra, alors vous paraîtrez aussi avec lui dans la gloire.</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Faites donc mourir les membres qui sont sur la terre, l'impudicité, l'impureté, les passions, les mauvais désirs, et la cupidité, qui est une idolâtrie.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 2:24</span>
                            <span class="verse-line"><span class="verse-num">24-</span>lui qui a porté lui-même nos péchés en son corps sur le bois, afin que morts aux péchés nous vivions pour la justice; lui par les meurtrissures duquel vous avez été guéris.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Galates 5:16</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Je dis donc: Marchez selon l'Esprit, et vous n'accomplirez pas les désirs de la chair.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse qu'en Christ je suis mort au péché et vivant pour toi. Le péché ne définit plus mon identité.",
                    declaration: "Je déclare que je suis vivant pour Dieu. Je déclare que mes pensées appartiennent au Seigneur. Mon corps appartient à Dieu. Mes paroles appartiennent à Dieu. Mes actions sont consacrées à Dieu. Je marche selon l'Esprit.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute domination du péché est brisée. Je proclame que je ne suis plus esclave de mes désirs anciens. Je proclame que la vie de Christ produit en moi une nouvelle manière de vivre. Je proclame que la sainteté de Dieu se manifeste dans mon quotidien.",
                    priere: "Père céleste, Merci parce que tu m'as rendu libre. Apprends-moi à considérer les choses d'en haut. Que mes choix reflètent mon appartenance à Christ. Fortifie-moi pour marcher dans l'obéissance. Amen.",
                    progression: "Je passe d'une vie centrée sur mes désirs à une vie consacrée aux desseins de Dieu."
                },
                "THÈME 28 — CHRIST A DÉPOUILLÉ LES PUISSANCES DES TÉNÈBRES": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 2:15</span>
                            <span class="verse-line"><span class="verse-num">15-</span>il a dépouillé les dominations et les autorités, et les a livrées publiquement en spectacle, en triomphant d'elles par la croix.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 2:14-15</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Ainsi donc, puisque les enfants participent au sang et à la chair, il y a également participé lui-même, afin que, par la mort, il anéantît celui qui a la puissance de la mort, c'est-à-dire le diable,</span>
                            <span class="verse-line"><span class="verse-num">15-</span>et qu'il délivrât tous ceux qui, par crainte de la mort, étaient toute leur vie retenus dans la servitude.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 1:20-23</span>
                            <span class="verse-line"><span class="verse-num">20-</span>Il l'a déployée en Christ, en le ressuscitant des morts, et en le faisant asseoir à sa droite dans les lieux célestes,</span>
                            <span class="verse-line"><span class="verse-num">21-</span>au-dessus de toute domination, de toute autorité, de toute puissance, de toute dignité, et de tout nom qui se peut nommer, non seulement dans le siècle présent, mais encore dans le siècle à venir.</span>
                            <span class="verse-line"><span class="verse-num">22-</span>Il a tout mis sous ses pieds, et il l'a donné pour chef suprême à l'Église,</span>
                            <span class="verse-line"><span class="verse-num">23-</span>qui est son corps, la plénitude de celui qui remplit tout en tous.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Jean 3:8</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Celui qui pèche est du diable, car le diable pèche dès le commencement. Le Fils de Dieu a paru afin de détruire les oeuvres du diable.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que Jésus-Christ a remporté une victoire totale sur les puissances des ténèbres. Par sa croix, il a désarmé les dominations et les autorités.",
                    declaration: "Je déclare que je ne suis plus sous la domination des ténèbres. Je déclare que Jésus est mon Seigneur et mon Libérateur. Je refuse la peur des puissances spirituelles. Je marche dans la lumière, la vérité et la victoire de Christ.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute puissance qui s'oppose à Dieu est vaincue par l'autorité de Jésus. Je proclame que la croix a triomphé. Je proclame que les œuvres du diable sont détruites dans ma vie. Je proclame que le règne de Christ s'établit en moi.",
                    priere: "Seigneur Jésus, Merci pour ta victoire parfaite. Merci parce que tu as vaincu les puissances ennemies. Apprends-moi à vivre dans cette réalité avec foi et humilité. Que ta lumière règne dans tous les domaines de ma vie. Amen.",
                    progression: "Je passe d'une conscience de la puissance de l'ennemi à une conscience supérieure de la victoire de Christ."
                }
            },
            // ============================================================
            // PARTIE IV — AUTORITÉ, VICTOIRE ET DÉLIVRANCE (Thèmes 29 à 38)
            // ============================================================
            "PARTIE IV — AUTORITÉ, VICTOIRE ET DÉLIVRANCE": {
                "THÈME 29 — SATAN EST SOUS LES PIEDS DE JÉSUS ET SOUS LES MIENS EN CHRIST": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 110:1</span>
                            <span class="verse-line"><span class="verse-num">1-</span>De David. Psaume. Parole de l'Éternel à mon Seigneur: Assieds-toi à ma droite, Jusqu'à ce que je fasse de tes ennemis ton marchepied.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 1:20-23</span>
                            <span class="verse-line"><span class="verse-num">20-</span>Il l'a déployée en Christ, en le ressuscitant des morts, et en le faisant asseoir à sa droite dans les lieux célestes,</span>
                            <span class="verse-line"><span class="verse-num">21-</span>au-dessus de toute domination, de toute autorité, de toute puissance, de toute dignité, et de tout nom qui se peut nommer, non seulement dans le siècle présent, mais encore dans le siècle à venir.</span>
                            <span class="verse-line"><span class="verse-num">22-</span>Il a tout mis sous ses pieds, et il l'a donné pour chef suprême à l'Église,</span>
                            <span class="verse-line"><span class="verse-num">23-</span>qui est son corps, la plénitude de celui qui remplit tout en tous.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 16:20</span>
                            <span class="verse-line"><span class="verse-num">20-</span>Le Dieu de paix écrasera bientôt Satan sous vos pieds. Que la grâce de notre Seigneur Jésus Christ soit avec vous!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Luc 10:19</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Voici, je vous ai donné le pouvoir de marcher sur les serpents et les scorpions, et sur toute la puissance de l'ennemi; et rien ne pourra vous nuire.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 2:6</span>
                            <span class="verse-line"><span class="verse-num">6-</span>il nous a ressuscités ensemble, et nous a fait asseoir ensemble dans les lieux célestes, en Jésus Christ,</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que Jésus-Christ est élevé au-dessus de toute puissance. Tout ennemi est placé sous ses pieds. Je crois qu'étant uni à Christ, je participe à sa victoire. Je ne combats pas depuis une position d'infériorité, mais depuis la position que Dieu m'a donnée en Jésus.",
                    declaration: "Je déclare que Jésus est Seigneur au-dessus de toute puissance. Je déclare que l'ennemi n'a pas le dernier mot sur ma vie. Je déclare que je marche dans l'autorité reçue de Christ. Je refuse la peur, l'intimidation et le découragement.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute œuvre de l'ennemi est soumise à l'autorité de Christ. Je proclame que toute oppression contraire à la volonté de Dieu doit reculer. Je proclame que je marche dans la victoire du Seigneur. Je proclame que le Royaume de Dieu avance dans ma vie.",
                    priere: "Seigneur Jésus. Merci parce que tu règnes au-dessus de toute puissance. Donne-moi de comprendre ma position en toi. Aide-moi à exercer l'autorité avec amour, sagesse et humilité. Que ton règne se manifeste dans ma vie. Amen.",
                    progression: "Je ne regarde plus l'ennemi comme supérieur. Je fixe mes yeux sur Christ, le Roi victorieux, et je marche dans son autorité."
                },
                "THÈME 30 — JÉSUS M'A DONNÉ AUTORITÉ SUR TOUTE PUISSANCE DE L'ENNEMI": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Luc 10:19</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Voici, je vous ai donné le pouvoir de marcher sur les serpents et les scorpions, et sur toute la puissance de l'ennemi; et rien ne pourra vous nuire.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 28:18-20</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Jésus, s'étant approché, leur parla ainsi: Tout pouvoir m'a été donné dans le ciel et sur la terre.</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Allez, faites de toutes les nations des disciples, les baptisant au nom du Père, du Fils et du Saint Esprit,</span>
                            <span class="verse-line"><span class="verse-num">20-</span>et enseignez-leur à observer tout ce que je vous ai prescrit. Et voici, je suis avec vous tous les jours, jusqu'à la fin du monde.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Marc 16:17-18</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Voici les miracles qui accompagneront ceux qui auront cru: en mon nom, ils chasseront les démons; ils parleront de nouvelles langues;</span>
                            <span class="verse-line"><span class="verse-num">18-</span>ils saisiront des serpents; s'ils boivent quelque breuvage mortel, il ne leur feront point de mal; ils imposeront les mains aux malades, et les malades, seront guéris.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jacques 4:7</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Soumettez-vous donc à Dieu; résistez au diable, et il fuira loin de vous.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 6:10-18</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Au reste, fortifiez-vous dans le Seigneur, et par sa force toute-puissante.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Revêtez-vous de toutes les armes de Dieu, afin de pouvoir tenir ferme contre les ruses du diable.</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Car nous n'avons pas à lutter contre la chair et le sang, mais contre les dominations, contre les autorités, contre les princes de ce monde de ténèbres, contre les esprits méchants dans les lieux célestes.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>C'est pourquoi, prenez toutes les armes de Dieu, afin de pouvoir résister dans le mauvais jour, et tenir ferme après avoir tout surmonté.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Tenez donc ferme: ayez à vos reins la vérité pour ceinture; revêtez la cuirasse de la justice;</span>
                            <span class="verse-line"><span class="verse-num">15-</span>mettez pour chaussure à vos pieds le zèle que donne l'Évangile de paix;</span>
                            <span class="verse-line"><span class="verse-num">16-</span>prenez par-dessus tout cela le bouclier de la foi, avec lequel vous pourrez éteindre tous les traits enflammés du malin;</span>
                            <span class="verse-line"><span class="verse-num">17-</span>prenez aussi le casque du salut, et l'épée de l'Esprit, qui est la parole de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Faites en tout temps par l'Esprit toutes sortes de prières et de supplications. Veillez à cela avec une entière persévérance, et priez pour tous les saints.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que toute autorité appartient à Jésus-Christ.",
                    declaration: "Je déclare que je marche dans l'autorité de Jésus. Je déclare que je suis fortifié par le Saint-Esprit. Je déclare que la Parole de Dieu est mon épée. Je déclare que je demeure ferme dans la foi.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que toute puissance ennemie est soumise à l'autorité du Seigneur. Je proclame que je résiste au diable et qu'il fuit. Je proclame que la lumière de Christ brille à travers ma vie. Je proclame que Dieu m'utilise comme un instrument de son Royaume.",
                    priere: "Père céleste, Merci pour l'autorité que tu m'accordes en Jésus-Christ. Apprends-moi à l'exercer avec sagesse et amour. Revêts-moi de toutes les armes spirituelles. Que ma vie témoigne de la puissance de ton Royaume. Au nom de Jésus. Amen.",
                    progression: "Je passe d'une attitude passive à une vie de foi active."
                },
                "THÈME 31 — JE SUIS PLUS QUE VAINQUEUR PAR CHRIST": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:31-39</span>
                            <span class="verse-line"><span class="verse-num">31-</span>Que dirons-nous donc à l'égard de ces choses? Si Dieu est pour nous, qui sera contre nous?</span>
                            <span class="verse-line"><span class="verse-num">32-</span>Lui, qui n'a point épargné son propre Fils, mais qui l'a livré pour nous tous, comment ne nous donnera-t-il pas aussi toutes choses avec lui?</span>
                            <span class="verse-line"><span class="verse-num">33-</span>Qui accusera les élus de Dieu? C'est Dieu qui justifie!</span>
                            <span class="verse-line"><span class="verse-num">34-</span>Qui les condamnera? Christ est mort; bien plus, il est ressuscité, il est à la droite de Dieu, et il intercède pour nous!</span>
                            <span class="verse-line"><span class="verse-num">35-</span>Qui nous séparera de l'amour de Christ? Sera-ce la tribulation, ou l'angoisse, ou la persécution, ou la faim, ou la nudité, ou le péril, ou l'épée?</span>
                            <span class="verse-line"><span class="verse-num">36-</span>selon qu'il est écrit: C'est à cause de toi qu'on nous met à mort tout le jour, Qu'on nous regarde comme des brebis destinées à la boucherie.</span>
                            <span class="verse-line"><span class="verse-num">37-</span>Mais dans toutes ces choses nous sommes plus que vainqueurs par celui qui nous a aimés.</span>
                            <span class="verse-line"><span class="verse-num">38-</span>Car j'ai l'assurance que ni la mort ni la vie, ni les anges ni les dominations, ni les choses présentes ni les choses à venir,</span>
                            <span class="verse-line"><span class="verse-num">39-</span>ni les puissances, ni la hauteur, ni la profondeur, ni aucune autre créature ne pourra nous séparer de l'amour de Dieu manifesté en Jésus Christ notre Seigneur.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Corinthiens 15:57</span>
                            <span class="verse-line"><span class="verse-num">57-</span>Mais grâces soient rendues à Dieu, qui nous donne la victoire par notre Seigneur Jésus Christ!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 2:14</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Grâces soient rendues à Dieu, qui nous fait toujours triompher en Christ, et qui répand par nous en tout lieu l'odeur de sa connaissance!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Apocalypse 12:11</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Ils l'ont vaincu à cause du sang de l'agneau et à cause de la parole de leur témoignage, et ils n'ont pas aimé leur vie jusqu'à craindre la mort.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 16:33</span>
                            <span class="verse-line"><span class="verse-num">33-</span>Je vous ai dit ces choses, afin que vous ayez la paix en moi. Vous aurez des tribulations dans le monde; mais prenez courage, j'ai vaincu le monde.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que je suis plus que vainqueur par Jésus-Christ qui m'a aimé. Ma victoire ne dépend pas de mes propres forces, mais de la puissance de ton amour et de l'œuvre parfaite de Christ. Je crois qu'aucune tribulation, aucune épreuve, aucune opposition ne pourra me séparer de ton amour. Je confesse que Jésus a déjà remporté la victoire et que je marche dans cette victoire.",
                    declaration: "Je déclare que je ne suis pas vaincu par les circonstances. Je déclare que Christ me fortifie dans toutes les situations. Je déclare que les difficultés ne déterminent pas ma destinée. Je marche avec assurance, car Dieu est avec moi. Je transforme les épreuves en occasions de manifester la fidélité de Dieu.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute opposition contre ma vie est soumise à la victoire de Christ. Je proclame que la peur, le découragement et le doute n'ont aucun pouvoir sur moi. Je proclame que je triomphe par la grâce de Dieu. Je proclame que les plans de Dieu pour ma vie s'accomplissent.",
                    priere: "Père céleste, Merci parce que ma victoire est en Jésus-Christ. Lorsque les difficultés apparaissent, rappelle-moi que tu es plus grand que toute situation. Fortifie ma foi et apprends-moi à persévérer. Que ma vie soit un témoignage de ta puissance. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse de mesurer ma vie selon mes combats. Je commence à regarder mes combats depuis la victoire déjà acquise en Christ."
                },
                "THÈME 32 — JE TRIOMPHE EN CHRIST": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 2:14</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Grâces soient rendues à Dieu, qui nous fait toujours triompher en Christ, et qui répand par nous en tout lieu l'odeur de sa connaissance!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 1:12-14</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Rendez grâces au Père, qui vous a rendus capables d'avoir part à l'héritage des saints dans la lumière,</span>
                            <span class="verse-line"><span class="verse-num">13-</span>qui nous a délivrés de la puissance des ténèbres et nous a transportés dans le royaume du Fils de son amour,</span>
                            <span class="verse-line"><span class="verse-num">14-</span>en qui nous avons la rédemption, la rémission des péchés.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 2:15</span>
                            <span class="verse-line"><span class="verse-num">15-</span>il a dépouillé les dominations et les autorités, et les a livrées publiquement en spectacle, en triomphant d'elles par la croix.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 60:14</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Avec Dieu, nous ferons des exploits; Il écrasera nos ennemis.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 108:14</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Avec Dieu, nous ferons des exploits; Il écrasera nos ennemis.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu me fais toujours triompher en Christ. Jésus a vaincu le péché, la mort et les puissances des ténèbres. Je ne marche pas dans la défaite, mais dans le triomphe de mon Seigneur. Je crois que ta grâce m'accompagne chaque jour.",
                    declaration: "Je déclare que la victoire de Jésus produit ses effets dans ma vie. Je déclare que je suis conduit par Dieu dans le triomphe. Je ne suis pas dominé par les circonstances. Je porte le témoignage de la fidélité de Dieu. Ma vie manifeste la gloire du Seigneur.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute œuvre qui cherche à m'arrêter est vaincue par la puissance de Dieu. Je proclame que la victoire de Christ est active dans mon esprit, mon âme et mon corps. Je proclame que je marche de progrès en progrès. Je proclame que Dieu transforme mes combats en témoignages.",
                    priere: "Seigneur Jésus, Merci parce que tu m'as conduit dans ton triomphe. Apprends-moi à garder les yeux fixés sur toi. Que ma bouche annonce tes victoires. Que ma vie révèle ta puissance. Amen.",
                    progression: "Je passe d'une mentalité de survie à une mentalité de victoire. Je découvre que Dieu m'appelle à vivre comme un témoin de son triomphe."
                },

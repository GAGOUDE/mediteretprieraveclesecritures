                "THÈME 33 — JE RÉSISTE AU DIABLE ET IL FUIT LOIN DE MOI": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Jacques 4:7</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Soumettez-vous donc à Dieu; résistez au diable, et il fuira loin de vous.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 5:8-9</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Soyez sobres, veillez. Votre adversaire, le diable, rôde comme un lion rugissant, cherchant qui il dévorera.</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Résistez-lui avec une foi ferme, sachant que les mêmes souffrances sont imposées à vos frères dans le monde.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 6:10-18</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Au reste, fortifiez-vous dans le Seigneur, et par sa force toute-puissante.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Revêtez-vous de toutes les armes de Dieu, afin de pouvoir tenir ferme contre les ruses du diable.</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Car nous n'avons pas à lutter contre la chair et le sang, mais contre les dominations, contre les autorités, contre les princes de ce monde de ténèbres, contre les esprits méchants dans les lieux célestes.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>C'est pourquoi, prenez toutes les armes de Dieu, afin de pouvoir résister dans le mauvais jour, et tenir ferme après avoir tout surmonté.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Tenez donc ferme: ayez à vos reins la vérité pour ceinture; revêtez la cuirasse de la justice;</span>
                            <span class="verse-line"><span class="verse-num">15-</span>mettez pour chaussure à vos pieds le zèle que donne l'Évangile de paix;</span>
                            <span class="verse-line"><span class="verse-num">16-</span>prenez par-dessus tout cela le bouclier de la foi, avec lequel vous pourrez éteindre tous les traits enflammés du malin;</span>
                            <span class="verse-line"><span class="verse-num">17-</span>prenez aussi le casque du salut, et l'épée de l'Esprit, qui est la parole de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Faites en tout temps par l'Esprit toutes sortes de prières et de supplications. Veillez à cela avec une entière persévérance, et priez pour tous les saints.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 4:1-11</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Alors Jésus fut emmené par l'Esprit dans le désert, pour être tenté par le diable.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Après avoir jeûné quarante jours et quarante nuits, il eut faim.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Le tentateur, s'étant approché, lui dit: Si tu es Fils de Dieu, ordonne que ces pierres deviennent des pains.</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Jésus répondit: Il est écrit: L'homme ne vivra pas de pain seulement, mais de toute parole qui sort de la bouche de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Le diable le transporta dans la ville sainte, le plaça sur le haut du temple,</span>
                            <span class="verse-line"><span class="verse-num">6-</span>et lui dit: Si tu es Fils de Dieu, jette-toi en bas; car il est écrit: Il donnera des ordres à ses anges à ton sujet; Et ils te porteront sur les mains, De peur que ton pied ne heurte contre une pierre.</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Jésus lui dit: Il est aussi écrit: Tu ne tenteras point le Seigneur, ton Dieu.</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Le diable le transporta encore sur une montagne très élevée, lui montra tous les royaumes du monde et leur gloire,</span>
                            <span class="verse-line"><span class="verse-num">9-</span>et lui dit: Je te donnerai toutes ces choses, si tu te prosternes et m'adores.</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Jésus lui dit: Retire-toi, Satan! Car il est écrit: Tu adoreras le Seigneur, ton Dieu, et tu le serviras lui seul.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Alors le diable le laissa. Et voici, des anges vinrent auprès de Jésus, et le servaient.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Luc 4:13</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Après l'avoir tenté de toutes ces manières, le diable s'éloigna de lui jusqu'à un moment favorable.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que je suis soumis à Dieu et que je peux résister au diable. Je ne suis pas sans défense, car tu m'as donné ta Parole, ta puissance et ton Esprit. Je crois que Jésus m'a montré l'exemple de la victoire par la vérité de Dieu.",
                    declaration: "Je déclare que je demeure ferme dans la foi. Je déclare que la Parole de Dieu est mon fondement. Je rejette les mensonges de l'ennemi. Je choisis la vérité, l'obéissance et la confiance en Dieu.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute tentation qui s'élève contre la volonté de Dieu est vaincue. Je proclame que je suis fortifié par le Saint-Esprit. Je proclame que l'ennemi n'a aucune autorité sur une vie soumise à Dieu. Je proclame que le diable fuit devant la puissance de Jésus-Christ.",
                    priere: "Père céleste, Donne-moi la sagesse de discerner les attaques de l'ennemi. Fortifie-moi pour rester ferme dans ta Parole. Apprends-moi à dépendre entièrement de toi. Que ma vie demeure sous ton autorité. Amen.",
                    progression: "Je passe d'une attitude passive à une attitude spirituellement vigilante. J'apprends à résister par la foi, la vérité et l'obéissance."
                },
                "THÈME 34 — JE RENONCE AUX ŒUVRES DES TÉNÈBRES": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Romains 13:12-14</span>
                            <span class="verse-line"><span class="verse-num">12-</span>La nuit est avancée, le jour approche. Dépouillons-nous donc des oeuvres des ténèbres, et revêtons les armes de la lumière.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Marchons honnêtement, comme en plein jour, loin des excès et de l'ivrognerie, de la luxure et de l'impudicité, des querelles et des jalousies.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Mais revêtez-vous du Seigneur Jésus Christ, et n'ayez pas soin de la chair pour en satisfaire les convoitises.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 5:8-11</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Autrefois vous étiez ténèbres, et maintenant vous êtes lumière dans le Seigneur. Marchez comme des enfants de lumière!</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Car le fruit de la lumière consiste en toute sorte de bonté, de justice et de vérité.</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Examinez ce qui est agréable au Seigneur;</span>
                            <span class="verse-line"><span class="verse-num">11-</span>et ne prenez point part aux oeuvres infructueuses des ténèbres, mais plutôt condamnez-les.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 1:12-13</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Rendez grâces au Père, qui vous a rendus capables d'avoir part à l'héritage des saints dans la lumière,</span>
                            <span class="verse-line"><span class="verse-num">13-</span>qui nous a délivrés de la puissance des ténèbres et nous a transportés dans le royaume du Fils de son amour,</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as délivré des ténèbres et que tu m'as transporté dans le Royaume de ton Fils bien-aimé. Je n'appartiens plus aux œuvres des ténèbres. Je suis appelé à marcher dans ta lumière. Je désire que toute ma vie soit agréable à Dieu.",
                    declaration: "Je déclare que je suis enfant de lumière. Je rejette tout ce qui s'oppose à la volonté de Dieu. Je renonce aux habitudes, pensées et comportements qui ne glorifient pas le Seigneur. Je choisis la vérité, la pureté et la sainteté.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que les œuvres des ténèbres n'ont plus de domination sur moi. Je proclame que la lumière de Christ règne dans ma vie. Je proclame que toute influence contraire à Dieu est rejetée. Je marche dans la liberté et la sainteté.",
                    priere: "Père céleste, Sonde mon cœur et montre-moi ce qui doit être abandonné. Purifie-moi par ton Esprit. Aide-moi à marcher dans la lumière chaque jour. Que ma vie honore ton nom. Amen.",
                    progression: "Je quitte progressivement les anciennes voies pour marcher pleinement dans la lumière de Christ."
                },
                "THÈME 35 — JE SUIS DÉLIVRÉ DU ROYAUME DES TÉNÈBRES": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 1:13-14</span>
                            <span class="verse-line"><span class="verse-num">13-</span>qui nous a délivrés de la puissance des ténèbres et nous a transportés dans le royaume du Fils de son amour,</span>
                            <span class="verse-line"><span class="verse-num">14-</span>en qui nous avons la rédemption, la rémission des péchés.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Actes 26:18</span>
                            <span class="verse-line"><span class="verse-num">18-</span>afin que tu leur ouvres les yeux, pour qu'ils passent des ténèbres à la lumière et de la puissance de Satan à Dieu, pour qu'ils reçoivent, par la foi en moi, le pardon des péchés et l'héritage avec les sanctifiés.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 2:1-6</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Vous étiez morts par vos offenses et par vos péchés,</span>
                            <span class="verse-line"><span class="verse-num">2-</span>dans lesquels vous marchiez autrefois, selon le train de ce monde, selon le prince de la puissance de l'air, de l'esprit qui agit maintenant dans les fils de la rébellion.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Nous tous aussi, nous étions de leur nombre, et nous vivions autrefois selon les convoitises de notre chair, accomplissant les volontés de la chair et de nos pensées, et nous étions par nature des enfants de colère, comme les autres...</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Mais Dieu, qui est riche en miséricorde, à cause du grand amour dont il nous a aimés,</span>
                            <span class="verse-line"><span class="verse-num">5-</span>nous qui étions morts par nos offenses, nous a rendus à la vie avec Christ (c'est par grâce que vous êtes sauvés);</span>
                            <span class="verse-line"><span class="verse-num">6-</span>il nous a ressuscités ensemble, et nous a fait asseoir ensemble dans les lieux célestes, en Jésus Christ,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 2:9</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Vous, au contraire, vous êtes une race élue, un sacerdoce royal, une nation sainte, un peuple acquis, afin que vous annonciez les vertus de celui qui vous a appelés des ténèbres à son admirable lumière,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 8:36</span>
                            <span class="verse-line"><span class="verse-num">36-</span>Si donc le Fils vous affranchit, vous serez réellement libres.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as délivré du pouvoir des ténèbres. Tu m'as transféré dans le Royaume de ton Fils bien-aimé. Je ne suis plus sous l'esclavage du péché ni sous la domination des ténèbres. Je suis libre en Jésus-Christ.",
                    declaration: "Je déclare que j'appartiens au Royaume de Dieu. Je déclare que Jésus est mon Seigneur et mon Libérateur. Je marche dans la lumière, la vérité et la liberté. Je refuse toute identité liée à mon ancienne vie.",
                    proclamation: "Au nom puissant de Jésus-Christ. Je proclame que toute chaîne spirituelle contraire à Dieu est brisée. Je proclame que les ténèbres n'ont plus de droit sur ma vie. Je proclame que la puissance du Royaume de Dieu agit en moi. Je marche dans la liberté que Christ m'a donnée.",
                    priere: "Père céleste, Merci parce que tu m'as délivré. Merci parce que Jésus m'a fait passer des ténèbres à la lumière. Aide-moi à vivre comme un citoyen de ton Royaume. Que ta lumière brille à travers ma vie.",
                    progression: "Je ne me définis plus par ce dont j'ai été délivré. Je vis désormais selon le Royaume auquel j'appartiens."
                },
                "THÈME 36 — JE BRISE TOUTE ALLIANCE CONTRAIRE À LA VOLONTÉ DE DIEU": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 2:14-15</span>
                            <span class="verse-line"><span class="verse-num">14-</span>il a effacé l'acte dont les ordonnances nous condamnaient et qui subsistait contre nous, et il l'a détruit en le clouant à la croix;</span>
                            <span class="verse-line"><span class="verse-num">15-</span>il a dépouillé les dominations et les autorités, et les a livrées publiquement en spectacle, en triomphant d'elles par la croix.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Galates 3:13</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Christ nous a rachetés de la malédiction de la loi, étant devenu malédiction pour nous-car il est écrit: Maudit est quiconque est pendu au bois, -</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 12:24</span>
                            <span class="verse-line"><span class="verse-num">24-</span>de Jésus qui est le médiateur de la nouvelle alliance, et du sang de l'aspersion qui parle mieux que celui d'Abel.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 28:18</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Votre alliance avec la mort sera détruite, Votre pacte avec le séjour des morts ne subsistera pas; Quand le fléau débordé passera, Vous serez par lui foulés aux pieds.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 6:14-18</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Ne vous mettez pas avec les infidèles sous un joug étranger. Car quel rapport y a-t-il entre la justice et l'iniquité? ou qu'y a-t-il de commun entre la lumière et les ténèbres?</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Quel accord y a-t-il entre Christ et Bélial? ou quelle part a le fidèle avec l'infidèle?</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Quel rapport y a-t-il entre le temple de Dieu et les idoles? Car nous sommes le temple du Dieu vivant, comme Dieu l'a dit: J'habiterai et je marcherai au milieu d'eux; je serai leur Dieu, et ils seront mon peuple.</span>
                            <span class="verse-line"><span class="verse-num">17-</span>C'est pourquoi, Sortez du milieu d'eux, Et séparez-vous, dit le Seigneur; Ne touchez pas à ce qui est impur, Et je vous accueillerai.</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Je serai pour vous un père, Et vous serez pour moi des fils et des filles, Dit le Seigneur tout puissant.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que la nouvelle alliance en Jésus-Christ est la seule alliance qui définit ma vie. Par le sang de Jésus, toute ancienne dette, toute condamnation et toute œuvre contraire à ta volonté ont été annulées. Je crois que Christ m'a racheté de toute malédiction et de toute domination qui ne vient pas de toi. Je t'appartiens entièrement.",
                    declaration: "Je déclare que le sang de Jésus est la marque de mon appartenance à Dieu. Je renonce à toute alliance, tout engagement ou toute influence qui s'oppose à ma relation avec Dieu. Je déclare que ma vie, mon esprit, mon âme et mon corps appartiennent au Seigneur. Je marche dans la liberté de la nouvelle alliance.",
                    proclamation: "Au nom puissant de Jésus-Christ. Je proclame que toute alliance contraire à la volonté de Dieu est annulée par la puissance de la croix. Je proclame que toute œuvre cachée qui cherche à maintenir une influence sur ma vie perd son pouvoir. Je proclame que je suis établi dans l'alliance éternelle de Jésus-Christ. Je proclame que seule la volonté de Dieu demeure dans ma vie.",
                    priere: "Père céleste, Merci pour la nouvelle alliance établie par le sang de Jésus. Je renonce à tout ce qui n'est pas conforme à ta volonté. Purifie ma vie et affermis mon engagement envers toi. Que mon cœur soit entièrement consacré à Jésus-Christ.",
                    progression: "Je passe d'une vie influencée par le passé à une vie fondée sur l'alliance parfaite de Christ."
                },
                "THÈME 37 — JE RENONCE AUX PAROLES, ENGAGEMENTS ET INFLUENCES OPPOSÉS À DIEU": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Proverbes 18:21</span>
                            <span class="verse-line"><span class="verse-num">21-</span>La mort et la vie sont au pouvoir de la langue; Quiconque l'aime en mangera les fruits.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 12:36-37</span>
                            <span class="verse-line"><span class="verse-num">36-</span>Je vous le dis: au jour du jugement, les hommes rendront compte de toute parole vaine qu'ils auront proférée.</span>
                            <span class="verse-line"><span class="verse-num">37-</span>Car par tes paroles tu seras justifié, et par tes paroles tu seras condamné.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jacques 3:5-10</span>
                            <span class="verse-line"><span class="verse-num">5-</span>De même, la langue est un petit membre, et elle se vante de grandes choses. Voici, comme un petit feu peut embraser une grande forêt.</span>
                            <span class="verse-line"><span class="verse-num">6-</span>La langue aussi est un feu; c'est le monde de l'iniquité. La langue est placée parmi nos membres, souillant tout le corps, et enflammant le cours de la vie, étant elle-même enflammée par la géhenne.</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Toutes les espèces de bêtes et d'oiseaux, de reptiles et d'animaux marins, sont domptés et ont été domptés par la nature humaine;</span>
                            <span class="verse-line"><span class="verse-num">8-</span>mais la langue, aucun homme ne peut la dompter; c'est un mal qu'on ne peut réprimer; elle est pleine d'un venin mortel.</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Par elle nous bénissons le Seigneur notre Père, et par elle nous maudissons les hommes faits à l'image de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">10-</span>De la même bouche sortent la bénédiction et la malédiction. Il ne faut pas, mes frères, qu'il en soit ainsi.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 10:9-10</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Si tu confesses de ta bouche le Seigneur Jésus, et si tu crois dans ton coeur que Dieu l'a ressuscité des morts, tu seras sauvé.</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Car c'est en croyant du coeur qu'on parvient à la justice, et c'est en confessant de la bouche qu'on parvient au salut, selon ce que dit l'Écriture:</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 4:29</span>
                            <span class="verse-line"><span class="verse-num">29-</span>Qu'il ne sorte de votre bouche aucune parole mauvaise, mais, s'il y a lieu, quelque bonne parole, qui serve à l'édification et communique une grâce à ceux qui l'entendent.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que mes paroles ont de la valeur devant toi.",
                    declaration: "Je déclare que ma bouche annonce la vie. Je déclare que mes paroles sont alignées avec la vérité de Dieu. Je refuse les murmures, les paroles destructrices et les déclarations contraires aux promesses divines. Je parle selon la foi, l'amour et la sagesse de Dieu.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que toute parole prononcée contre les plans de Dieu pour ma vie est annulée. Je proclame que ma bouche devient un instrument de bénédiction. Je proclame que mes pensées et mes paroles sont renouvelées par le Saint-Esprit. Je proclame la vie, la paix et la victoire de Christ.",
                    priere: "Père céleste, Mets une garde sur ma bouche. Apprends-moi à parler comme ton enfant. Que mes paroles encouragent, guérissent et glorifient ton nom. Que ma confession soit toujours en accord avec ta vérité. Amen.",
                    progression: "Je prends conscience que mes paroles révèlent ma foi. Je décide d'utiliser ma bouche pour proclamer la vérité, la vie et la victoire de Christ."
                },
                "THÈME 38 — JE MARCHE DANS LA LIBERTÉ DE CHRIST": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Galates 5:1</span>
                            <span class="verse-line"><span class="verse-num">1-</span>C'est pour la liberté que Christ nous a affranchis. Demeurez donc fermes, et ne vous laissez pas mettre de nouveau sous le joug de la servitude.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 8:36</span>
                            <span class="verse-line"><span class="verse-num">36-</span>Si donc le Fils vous affranchit, vous serez réellement libres.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 3:17</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Or, le Seigneur c'est l'Esprit; et là où est l'Esprit du Seigneur, là est la liberté.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:1-2</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Il n'y a donc maintenant aucune condamnation pour ceux qui sont en Jésus-Christ.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>En effet, la loi de l'Esprit de vie en Jésus-Christ m'a affranchi de la loi du péché et de la mort.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Luc 4:18</span>
                            <span class="verse-line"><span class="verse-num">18-</span>L'Esprit du Seigneur est sur moi, Parce qu'il m'a oint pour annoncer une bonne nouvelle aux pauvres; Il m'a envoyé pour guérir ceux qui ont le coeur brisé, Pour proclamer aux captifs la délivrance, Et aux aveugles le recouvrement de la vue, Pour renvoyer libres les opprimés,</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que Jésus-Christ m'a rendu libre. Je ne suis plus esclave du péché, de la peur ou de la condamnation. La liberté que Christ me donne est véritable et complète. Je crois que ton Esprit me conduit dans une vie nouvelle.",
                    declaration: "Je déclare que je marche dans la liberté de Christ. Je refuse toute forme d'esclavage spirituel, émotionnel ou intérieur. Je déclare que la grâce de Dieu me fortifie. Je vis comme une personne libérée et transformée par Jésus.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute chaîne qui cherche à m'asservir est brisée. Je proclame que la puissance du Saint-Esprit agit en moi. Je proclame que je suis libre de servir Dieu avec joie. Je proclame que ma vie manifeste la liberté des enfants de Dieu.",
                    priere: "Seigneur Jésus. Merci pour la liberté que tu m'as donnée. Aide-moi à ne jamais retourner sous les anciennes chaînes. Apprends-moi à marcher chaque jour dans ta grâce. Que ma liberté serve à glorifier ton nom. Amen.",
                    progression: "Je ne cherche plus seulement à être délivré. J'apprends à vivre durablement dans la liberté que Christ m'a donnée."
                }
            },
            // ============================================================
            // PARTIE V — LE SAINT-ESPRIT ET LA VIE EN DIEU (Thèmes 39 à 47)
            // ============================================================
            "PARTIE V — LE SAINT-ESPRIT ET LA VIE EN DIEU": {
                "THÈME 39 — DIEU DEMEURE EN MOI": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">1 Jean 4:12-16</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Personne n'a jamais vu Dieu; si nous nous aimons les uns les autres, Dieu demeure en nous, et son amour est parfait en nous.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Nous connaissons que nous demeurons en lui, et qu'il demeure en nous, en ce qu'il nous a donné de son Esprit.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Et nous, nous avons vu et nous attestons que le Père a envoyé le Fils comme Sauveur du monde.</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Celui qui confessera que Jésus est le Fils de Dieu, Dieu demeure en lui, et lui en Dieu.</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Et nous, nous avons connu l'amour que Dieu a pour nous, et nous y avons cru. Dieu est amour; et celui qui demeure dans l'amour demeure en Dieu, et Dieu demeure en lui.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 14:23</span>
                            <span class="verse-line"><span class="verse-num">23-</span>Jésus lui répondit: Si quelqu'un m'aime, il gardera ma parole, et mon Père l'aimera; nous viendrons à lui, et nous ferons notre demeure chez lui.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Corinthiens 3:16</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Ne savez-vous pas que vous êtes le temple de Dieu, et que l'Esprit de Dieu habite en vous?</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 2:22</span>
                            <span class="verse-line"><span class="verse-num">22-</span>En lui vous êtes aussi édifiés pour être une habitation de Dieu en Esprit.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Apocalypse 21:3</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Et j'entendis du trône une forte voix qui disait: Voici le tabernacle de Dieu avec les hommes! Il habitera avec eux, et ils seront son peuple, et Dieu lui-même sera avec eux.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu demeures en moi par ton Esprit.",
                    declaration: "Je déclare que Dieu habite en moi. Je déclare que sa présence remplit mon esprit, mon âme et mon corps. Je déclare que je porte la présence de Dieu partout où je vais. Je ne marche pas selon mes seules capacités, mais avec l'aide du Seigneur qui demeure en moi.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que la présence de Dieu est plus grande que toute opposition. Je proclame que les ténèbres ne peuvent dominer une vie habitée par Dieu. Je proclame que la paix, la sagesse et la puissance de Dieu agissent en moi. Je proclame que ma vie devient un témoignage vivant de sa présence.",
                    priere: "Père céleste, Merci parce que tu as choisi de demeurer en moi. Aide-moi à honorer ta présence chaque jour. Que mes pensées, mes paroles et mes actions reflètent celui qui habite en moi. Que ma vie soit une maison agréable pour ton Esprit. Au nom de Jésus-Christ. Amen.",
                    progression: "Je ne cherche plus seulement la présence de Dieu autour de moi. Je vis dans la conscience qu'il demeure en moi."
                },
                "THÈME 40 — LE SAINT-ESPRIT HABITE EN MOI": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Jean 14:16-17</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Et moi, je prierai le Père, et il vous donnera un autre consolateur, afin qu'il demeure éternellement avec vous,</span>
                            <span class="verse-line"><span class="verse-num">17-</span>l'Esprit de vérité, que le monde ne peut recevoir, parce qu'il ne le voit point et ne le connaît point; mais vous, vous le connaissez, car il demeure avec vous, et il sera en vous.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:9-11</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Pour vous, vous ne vivez pas selon la chair, mais selon l'esprit, si du moins l'Esprit de Dieu habite en vous. Si quelqu'un n'a pas l'Esprit de Christ, il ne lui appartient pas.</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Et si Christ est en vous, le corps, il est vrai, est mort à cause du péché, mais l'esprit est vie à cause de la justice.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Et si l'Esprit de celui qui a ressuscité Jésus d'entre les morts habite en vous, celui qui a ressuscité Christ d'entre les morts rendra aussi la vie à vos corps mortels par son Esprit qui habite en vous.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Corinthiens 3:16</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Ne savez-vous pas que vous êtes le temple de Dieu, et que l'Esprit de Dieu habite en vous?</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 3:16-17</span>
                            <span class="verse-line"><span class="verse-num">16-</span>afin qu'il vous donne, selon la richesse de sa gloire, d'être puissamment fortifiés par son Esprit dans l'homme intérieur,</span>
                            <span class="verse-line"><span class="verse-num">17-</span>en sorte que Christ habite dans vos cœurs par la foi; afin qu'étant enracinés et fondés dans l'amour,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Timothée 1:14</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Garde le bon dépôt, par le Saint Esprit qui habite en nous.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que ton Saint-Esprit habite en moi. Je ne suis pas seul dans ma marche avec Dieu. Ta présence demeure en moi pour me guider, m'enseigner et me fortifier. Je crois que le même Esprit qui a ressuscité Jésus agit en moi.",
                    declaration: "Je déclare que je suis conduit par le Saint-Esprit. Je déclare que sa présence produit en moi la sagesse, la paix et la puissance. Je suis sensible à sa voix. Je marche selon sa direction.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que la présence de Dieu demeure en moi. Je proclame que toute influence contraire à l'œuvre du Saint-Esprit est rejetée. Je proclame que mon esprit est fortifié par la puissance divine. Je proclame que ma vie manifeste le fruit de l'Esprit.",
                    priere: "Père céleste. Merci pour le don merveilleux du Saint-Esprit. Apprends-moi à marcher dans une communion constante avec lui. Guide mes pensées, mes décisions et mes actions. Que ta présence transforme toute ma vie. Amen.",
                    progression: "Je passe d'une vie dirigée par mes propres capacités à une vie dépendante du Saint-Esprit."
                },
                "THÈME 41 — MON CORPS EST LE TEMPLE DU SAINT-ESPRIT": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">1 Corinthiens 6:19-20</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Ne savez-vous pas que votre corps est le temple du Saint Esprit qui est en vous, que vous avez reçu de Dieu, et que vous ne vous appartenez point à vous-mêmes?</span>
                            <span class="verse-line"><span class="verse-num">20-</span>Car vous avez été rachetés à un grand prix. Glorifiez donc Dieu dans votre corps et dans votre esprit, qui appartiennent à Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Corinthiens 3:16-17</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Ne savez-vous pas que vous êtes le temple de Dieu, et que l'Esprit de Dieu habite en vous?</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Si quelqu'un détruit le temple de Dieu, Dieu le détruira; car le temple de Dieu est saint, et c'est ce que vous êtes.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 12:1</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Je vous exhorte donc, frères, par les compassions de Dieu, à offrir vos corps comme un sacrifice vivant, saint, agréable à Dieu, ce qui sera de votre part un culte raisonnable.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 6:16</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Quel rapport y a-t-il entre le temple de Dieu et les idoles? Car nous sommes le temple du Dieu vivant, comme Dieu l'a dit: J'habiterai et je marcherai au milieu d'eux; je serai leur Dieu, et ils seront mon peuple.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 2:21-22</span>
                            <span class="verse-line"><span class="verse-num">21-</span>En lui tout l'édifice, bien coordonné, s'élève pour être un temple saint dans le Seigneur.</span>
                            <span class="verse-line"><span class="verse-num">22-</span>En lui vous êtes aussi édifiés pour être une habitation de Dieu en Esprit.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que mon corps est le temple du Saint-Esprit. Mon corps ne m'appartient pas, car j'ai été racheté à un grand prix par le sang de Jésus. Je crois que mon esprit, mon âme et mon corps appartiennent au Seigneur.",
                    declaration: "Je déclare que mon corps est consacré à Dieu. Je prends soin de ce que Dieu m'a confié. Je refuse toute pratique qui détruit ou souille ce temple. Je déclare que la vie de Dieu agit en moi.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que mon corps appartient au Seigneur. Je proclame que toute œuvre de destruction contre ma santé et ma vie est rejetée. Je proclame que Dieu est glorifié dans mon corps. Je proclame que la présence du Saint-Esprit demeure en moi.",
                    priere: "Père céleste, Merci parce que tu demeures en moi par ton Esprit. Aide-moi à honorer mon corps comme un temple consacré. Donne-moi la sagesse pour prendre soin de ce que tu m'as confié. Que toute ma vie rende gloire à Jésus-Christ. Amen.",
                    progression: "Je comprends que mon corps n'est pas simplement biologique, mais qu'il appartient à Dieu. J'apprends à vivre dans le respect et la consécration envers le temple du Saint-Esprit."
                },
                "THÈME 42 — JE SUIS REMPLI DU SAINT-ESPRIT": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 5:18</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Ne vous enivrez pas de vin: c'est de la débauche. Soyez, au contraire, remplis de l'Esprit;</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Actes 2:1-4</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Le jour de la Pentecôte, ils étaient tous ensemble dans le même lieu.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Tout à coup il vint du ciel un bruit comme celui d'un vent impétueux, et il remplit toute la maison où ils étaient assis.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Des langues, semblables à des langues de feu, leur apparurent, séparées les unes des autres, et se posèrent sur chacun d'eux.</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Et ils furent tous remplis du Saint Esprit, et se mirent à parler en d'autres langues, selon que l'Esprit leur donnait de s'exprimer.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Actes 4:31</span>
                            <span class="verse-line"><span class="verse-num">31-</span>Quand ils eurent prié, le lieu où ils étaient assemblés trembla; ils furent tous remplis du Saint Esprit, et ils annonçaient la parole de Dieu avec assurance.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Actes 13:52</span>
                            <span class="verse-line"><span class="verse-num">52-</span>tandis que les disciples étaient remplis de joie et du Saint Esprit.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Luc 11:13</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Si donc, méchants comme vous l'êtes, vous savez donner de bonnes choses à vos enfants, à combien plus forte raison le Père céleste donnera-t-il le Saint Esprit à ceux qui le lui demandent.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as donné ton Saint-Esprit. Je crois que je peux être rempli continuellement de ta présence et de ta puissance. Je ne dépend pas uniquement de mes forces humaines. Je reçois ton Esprit pour vivre, servir et témoigner de Jésus-Christ.",
                    declaration: "Je déclare que le Saint-Esprit me remplit chaque jour. Je déclare que sa puissance agit dans ma faiblesse. Je déclare que sa sagesse guide mes décisions. Je déclare que son amour transforme mon cœur. Je marche rempli de Dieu.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que le Saint-Esprit produit en moi une vie nouvelle. Je proclame que toute peur, toute timidité et tout découragement sont remplacés par la puissance de Dieu. Je proclame que je suis équipé pour accomplir les œuvres préparées par le Seigneur. Je proclame que ma vie manifeste la gloire de Dieu.",
                    priere: "Père céleste, Remplis-moi davantage de ton Saint-Esprit. Que ta puissance renouvelle mon être intérieur. Donne-moi de marcher dans ta volonté avec courage et fidélité. Utilise-moi pour l'avancement de ton Royaume. Amen.",
                    progression: "Je passe d'une vie basée sur mes capacités à une vie dépendante de la puissance du Saint-Esprit."
                },
                "THÈME 43 — JE MARCHE PAR L'ESPRIT": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Galates 5:16-25</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Je dis donc: Marchez selon l'Esprit, et vous n'accomplirez pas les désirs de la chair.</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Car la chair a des désirs contraires à ceux de l'Esprit, et l'Esprit en a de contraires à ceux de la chair; ils sont opposés entre eux, afin que vous ne fassiez point ce que vous voudriez.</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Si vous êtes conduits par l'Esprit, vous n'êtes point sous la loi.</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Or, les oeuvres de la chair sont manifestes, ce sont l'impudicité, l'impureté, la dissolution,</span>
                            <span class="verse-line"><span class="verse-num">20-</span>l'idolâtrie, la magie, les inimitiés, les querelles, les jalousies, les animosités, les disputes, les divisions, les sectes,</span>
                            <span class="verse-line"><span class="verse-num">21-</span>l'envie, l'ivrognerie, les excès de table, et les choses semblables. Je vous dis d'avance, comme je l'ai déjà dit, que ceux qui commettent de telles choses n'hériteront point le royaume de Dieu.</span>
                            <span class="verse-line"><span class="verse-num">22-</span>Mais le fruit de l'Esprit, c'est l'amour, la joie, la paix, la patience, la bonté, la bénignité, la fidélité, la douceur, la tempérance;</span>
                            <span class="verse-line"><span class="verse-num">23-</span>la loi n'est pas contre ces choses.</span>
                            <span class="verse-line"><span class="verse-num">24-</span>Ceux qui sont à Jésus Christ ont crucifié la chair avec ses passions et ses désirs.</span>
                            <span class="verse-line"><span class="verse-num">25-</span>Si nous vivons par l'Esprit, marchons aussi selon l'Esprit.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:5-14</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Ceux, en effet, qui vivent selon la chair, s'affectionnent aux choses de la chair, tandis que ceux qui vivent selon l'esprit s'affectionnent aux choses de l'esprit.</span>
                            <span class="verse-line"><span class="verse-num">6-</span>Et l'affection de la chair, c'est la mort, tandis que l'affection de l'esprit, c'est la vie et la paix;</span>
                            <span class="verse-line"><span class="verse-num">7-</span>car l'affection de la chair est inimitié contre Dieu, parce qu'elle ne se soumet pas à la loi de Dieu, et qu'elle ne le peut même pas.</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Or ceux qui vivent selon la chair ne sauraient plaire à Dieu.</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Pour vous, vous ne vivez pas selon la chair, mais selon l'esprit, si du moins l'Esprit de Dieu habite en vous. Si quelqu'un n'a pas l'Esprit de Christ, il ne lui appartient pas.</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Et si Christ est en vous, le corps, il est vrai, est mort à cause du péché, mais l'esprit est vie à cause de la justice.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Et si l'Esprit de celui qui a ressuscité Jésus d'entre les morts habite en vous, celui qui a ressuscité Christ d'entre les morts rendra aussi la vie à vos corps mortels par son Esprit qui habite en vous.</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Ainsi donc, frères, nous ne sommes point redevables à la chair, pour vivre selon la chair.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Si vous vivez selon la chair, vous mourrez; mais si par l'Esprit vous faites mourir les actions du corps, vous vivrez,</span>
                            <span class="verse-line"><span class="verse-num">14-</span>car tous ceux qui sont conduits par l'Esprit de Dieu sont fils de Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Ézéchiel 36:27</span>
                            <span class="verse-line"><span class="verse-num">27-</span>Je mettrai mon esprit en vous, et je ferai en sorte que vous suiviez mes ordonnances, et que vous observiez et pratiquiez mes lois.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 16:13</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Quand le consolateur sera venu, l'Esprit de vérité, il vous conduira dans toute la vérité; car il ne parlera pas de lui-même, mais il dira tout ce qu'il aura entendu, et il vous annoncera les choses à venir.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 12:2</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Ne vous conformez pas au siècle présent, mais soyez transformés par le renouvellement de l'intelligence, afin que vous discerniez quelle est la volonté de Dieu, ce qui est bon, agréable et parfait.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que ton Esprit me conduit. Je ne suis plus appelé à vivre selon les désirs de la chair, mais selon ta volonté. Je crois que le Saint-Esprit produit en moi le vouloir et le faire selon ton dessein. Je choisis d'être dirigé par toi.",
                    declaration: "Je déclare que je marche selon l'Esprit. Je déclare que mes pensées sont renouvelées par Dieu. Je déclare que mes décisions sont guidées par sa sagesse. Je déclare que je porte le caractère de Christ. Je choisis chaque jour la voie de l'Esprit.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que la chair ne domine pas ma vie. Je proclame que le Saint-Esprit règne sur mes pensées, mes émotions et mes actions. Je proclame que toute influence contraire à Dieu perd son pouvoir. Je marche dans la liberté et la victoire de l'Esprit.",
                    priere: "Seigneur. Apprends-moi à marcher selon ton Esprit. Aide-moi à reconnaître ta voix et à obéir à ta direction. Transforme mes désirs afin qu'ils correspondent à ta volonté. Que Christ soit formé en moi. Amen.",
                    progression: "Je cesse d'être gouverné par mes impulsions naturelles. J'apprends à vivre sous la direction quotidienne du Saint-Esprit."
                },
                "THÈME 44 — JE PORTE LE FRUIT DE L'ESPRIT": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Galates 5:22-23</span>
                            <span class="verse-line"><span class="verse-num">22-</span>Mais le fruit de l'Esprit, c'est l'amour, la joie, la paix, la patience, la bonté, la bénignité, la fidélité, la douceur, la tempérance;</span>
                            <span class="verse-line"><span class="verse-num">23-</span>la loi n'est pas contre ces choses.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 15:5</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 3:12-15</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Ainsi donc, comme des élus de Dieu, saints et bien-aimés, revêtez-vous d'entrailles de miséricorde, de bonté, d'humilité, de douceur, de patience.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Supportez-vous les uns les autres, et, si l'un a sujet de se plaindre de l'autre, pardonnez-vous réciproquement. De même que Christ vous a pardonné, pardonnez-vous aussi.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Mais par-dessus toutes ces choses revêtez-vous de l'amour, qui est le lien de la perfection.</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Et que la paix de Christ, à laquelle vous avez été appelés pour former un seul corps, règne dans vos cœurs. Et soyez reconnaissants.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 1:11</span>
                            <span class="verse-line"><span class="verse-num">11-</span>remplis du fruit de justice qui est par Jésus Christ, à la gloire et à la louange de Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 7:17-18</span>
                            <span class="verse-line"><span class="verse-num">17-</span> Tout bon arbre porte de bons fruits, mais le mauvais arbre porte de mauvais fruits.</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Un bon arbre ne peut porter de mauvais fruits, ni un mauvais arbre porter de bons fruits.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que ton Esprit produit son fruit en moi. Je ne cherche pas seulement des dons, mais une transformation du caractère. Je crois que l'amour, la joie, la paix et toutes les qualités de Christ grandissent en moi. Je demeure attaché à Jésus, le véritable Cep.",
                    declaration: "Je déclare que l'amour de Dieu remplit mon cœur. Je déclare que sa paix garde mes pensées. Je déclare que sa patience transforme mes réactions. Je déclare que sa bonté influence mes relations. Je porte le caractère de Jésus-Christ.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que le fruit de l'Esprit grandit dans ma vie. Je proclame que l'ancienne nature perd son influence. Je proclame que mes paroles et mes actions reflètent Christ. Je proclame que ma vie porte du fruit pour la gloire de Dieu.",
                    priere: "Père céleste, Fais grandir ton fruit en moi. Transforme mon caractère selon l'image de Jésus. Apprends-moi à aimer comme Christ aime. Que ma vie bénisse ceux qui m'entourent. Amen.",
                    progression: "Je ne cherche plus seulement à changer mon comportement. Je laisse Dieu transformer mon cœur afin que le fruit apparaisse naturellement."
                },
                "THÈME 45 — JE SUIS REVÊTU DE LA PUISSANCE D'EN HAUT": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Luc 24:49</span>
                            <span class="verse-line"><span class="verse-num">49-</span>Et voici, j'enverrai sur vous ce que mon Père a promis; mais vous, restez dans la ville jusqu'à ce que vous soyez revêtus de la puissance d'en haut.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Actes 1:8</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Mais vous recevrez une puissance, le Saint Esprit survenant sur vous, et vous serez mes témoins à Jérusalem, dans toute la Judée, dans la Samarie, et jusqu'aux extrémités de la terre.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 3:16</span>
                            <span class="verse-line"><span class="verse-num">16-</span>afin qu'il vous donne, selon la richesse de sa gloire, d'être puissamment fortifiés par son Esprit dans l'homme intérieur,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 6:10</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Au reste, fortifiez-vous dans le Seigneur, et par sa force toute-puissante.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as donné une puissance qui vient d'en haut. Cette puissance ne vient pas de mes capacités humaines, mais du Saint-Esprit. Je crois que tu me fortifies pour accomplir ta volonté et témoigner de Jésus-Christ.",
                    declaration: "Je déclare que je suis fortifié par la puissance de Dieu. Je déclare que je ne suis pas dominé par la peur. Je déclare que le Saint-Esprit me donne courage, sagesse et assurance. Je marche équipé pour accomplir les œuvres de Dieu.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que la puissance du Saint-Esprit agit dans ma vie. Je proclame que toute faiblesse qui m'empêche d'accomplir la volonté de Dieu est vaincue. Je proclame que je suis rendu capable par la grâce de Dieu. Je proclame que ma vie sera un témoignage de la puissance divine.",
                    priere: "Père céleste, Revêts-moi de ta puissance d'en haut. Fortifie mon esprit afin que je sois un témoin fidèle de Jésus. Donne-moi le courage de marcher dans mon appel. Que ta puissance se manifeste pour ta gloire. Amen.",
                    progression: "Je cesse de compter uniquement sur mes ressources personnelles. J'apprends à servir Dieu par la puissance que le Saint-Esprit donne."
                },
                "THÈME 46 — LE SAINT-ESPRIT VIVIFIE MON CORPS": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:11</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Et si l'Esprit de celui qui a ressuscité Jésus d'entre les morts habite en vous, celui qui a ressuscité Christ d'entre les morts rendra aussi la vie à vos corps mortels par son Esprit qui habite en vous.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 6:63</span>
                            <span class="verse-line"><span class="verse-num">63-</span>C'est l'esprit qui vivifie; la chair ne sert de rien. Les paroles que je vous ai dites sont esprit et vie.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 4:10-11</span>
                            <span class="verse-line"><span class="verse-num">10-</span>portant toujours avec nous dans notre corps la mort de Jésus, afin que la vie de Jésus soit aussi manifestée dans notre corps.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Car nous qui vivons, nous sommes sans cesse livrés à la mort à cause de Jésus, afin que la vie de Jésus soit aussi manifestée dans notre chair mortelle.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 40:29-31</span>
                            <span class="verse-line"><span class="verse-num">29-</span>Il donne de la force à celui qui est fatigué, Et il augmente la vigueur de celui qui tombe en défaillance.</span>
                            <span class="verse-line"><span class="verse-num">30-</span>Les adolescents se fatiguent et se lassent, Et les jeunes hommes chancellent;</span>
                            <span class="verse-line"><span class="verse-num">31-</span>Mais ceux qui se confient en l'Éternel renouvellent leur force. Ils prennent le vol comme les aigles; Ils courent, et ne se lassent point, Ils marchent, et ne se fatiguent point.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 103:1-5</span>
                            <span class="verse-line"><span class="verse-num">1-</span>De David. Mon âme, bénis l'Éternel! Tout ce qui est en moi bénisse son saint nom!</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Mon âme, bénis l'Éternel, Et n'oublie aucun de ses bienfaits!</span>
                            <span class="verse-line"><span class="verse-num">3-</span>C'est lui qui pardonne toutes tes iniquités, Qui guérit toutes tes maladies;</span>
                            <span class="verse-line"><span class="verse-num">4-</span>C'est lui qui délivre ta vie de la fosse, Qui te couronne de bonté et de miséricorde;</span>
                            <span class="verse-line"><span class="verse-num">5-</span>C'est lui qui rassasie de biens ta vieillesse, Qui te fait rajeunir comme l'aigle.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que le même Esprit qui a ressuscité Jésus-Christ d'entre les morts habite en moi. Je crois que cet Esprit vivifie aussi mon corps mortel. La vie de Dieu agit dans chacune de mes cellules, dans chacun de mes organes et dans tout mon être. Je reçois la force, la santé et le renouvellement que donne le Saint-Esprit.",
                    declaration: "Je déclare que la vie de Dieu circule en moi. Je déclare que le Saint-Esprit renouvelle continuellement mon corps. Je déclare que toute faiblesse est remplacée par la force du Seigneur. Je marche dans la vie abondante que Jésus m'a acquise.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que l'Esprit de Dieu vivifie tout mon être. Je proclame que toute œuvre de mort, de faiblesse et de destruction recule devant la vie de Dieu. Je proclame que mon corps répond à la puissance de la résurrection de Jésus-Christ. Je proclame que la gloire de Dieu se manifeste dans ma santé et dans mes forces.",
                    priere: "Père céleste, Merci pour le Saint-Esprit qui demeure en moi. Que sa puissance de résurrection renouvelle mon corps chaque jour. Fortifie-moi dans mon être intérieur et dans mon corps. Que je vive pleinement pour accomplir ta volonté. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse de regarder uniquement mes limites physiques. J'apprends à compter sur la puissance vivifiante du Saint-Esprit qui agit continuellement en moi."
                },
                "THÈME 47 — JE MANIFESTE LA VIE DE CHRIST": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Galates 2:20</span>
                            <span class="verse-line"><span class="verse-num">20-</span>J'ai été crucifié avec Christ; et si je vis, ce n'est plus moi qui vis, c'est Christ qui vit en moi; si je vis maintenant dans la chair, je vis dans la foi au Fils de Dieu, qui m'a aimé et qui s'est livré lui-même pour moi.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 3:3-4</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Car vous êtes morts, et votre vie est cachée avec Christ en Dieu.</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Quand Christ, votre vie, paraîtra, alors vous paraîtrez aussi avec lui dans la gloire.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 10:10</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Le voleur ne vient que pour dérober, égorger et détruire; moi, je suis venu afin que les brebis aient la vie, et qu'elles soient dans l'abondance.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 4:10-11</span>
                            <span class="verse-line"><span class="verse-num">10-</span>portant toujours avec nous dans notre corps la mort de Jésus, afin que la vie de Jésus soit aussi manifestée dans notre corps.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Car nous qui vivons, nous sommes sans cesse livrés à la mort à cause de Jésus, afin que la vie de Jésus soit aussi manifestée dans notre chair mortelle.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 1:21</span>
                            <span class="verse-line"><span class="verse-num">21-</span>Car Christ est ma vie, et la mort m'est un gain.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que Christ est ma vie. Je ne vis plus pour moi-même, mais pour celui qui est mort et ressuscité pour moi. La vie de Jésus se manifeste en moi par le Saint-Esprit. Je crois que chaque jour je suis transformé à son image.",
                    declaration: "Je déclare que la vie de Christ se manifeste dans mes pensées. Je déclare que la vie de Christ se manifeste dans mes paroles. Je déclare que la vie de Christ se manifeste dans mes attitudes. Je déclare que la vie de Christ se manifeste dans mon corps, dans mon travail, dans ma famille et dans mon ministère.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que la vie de Jésus chasse toute œuvre de mort. Je proclame que la puissance de la résurrection agit continuellement en moi. Je proclame que ma vie révèle Jésus à ceux qui m'entourent. Je proclame que Christ est tout en tous en moi.",
                    priere: "Seigneur Jésus, Vis pleinement en moi. Que mes pensées, mes paroles et mes actions reflètent ton caractère. Transforme-moi chaque jour à ton image. Que tous ceux qui me rencontrent puissent voir ta vie se manifester en moi. Amen.",
                    progression: "Je cesse de chercher à vivre la vie chrétienne par mes propres forces. Je laisse Christ vivre sa vie en moi par le Saint-Esprit."
                }
            },
            // ============================================================
            // PARTIE VI — GUÉRISON, PROTECTION ET BÉNÉDICTION (Thèmes 48 à 57)
            // ============================================================
            "PARTIE VI — GUÉRISON, PROTECTION ET BÉNÉDICTION": {
                "THÈME 48 — JÉSUS A PORTÉ MES MALADIES": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 53:4-5</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Cependant, ce sont nos souffrances qu'il a portées, C'est de nos douleurs qu'il s'est chargé; Et nous l'avons considéré comme puni, Frappé de Dieu, et humilié.</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Mais il était blessé pour nos péchés, Brisé pour nos iniquités; Le châtiment qui nous donne la paix est tombé sur lui, Et c'est par ses meurtrissures que nous sommes guéris.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 8:16-17</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Le soir, on amena auprès de Jésus plusieurs démoniaques. Il chassa les esprits par sa parole, et il guérit tous les malades,</span>
                            <span class="verse-line"><span class="verse-num">17-</span>afin que s'accomplît ce qui avait été annoncé par Ésaïe, le prophète: Il a pris nos infirmités, et il s'est chargé de nos maladies.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 103:2-3</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Mon âme, bénis l'Éternel, Et n'oublie aucun de ses bienfaits!</span>
                            <span class="verse-line"><span class="verse-num">3-</span>C'est lui qui pardonne toutes tes iniquités, Qui guérit toutes tes maladies;</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Exode 15:26</span>
                            <span class="verse-line"><span class="verse-num">26-</span>Il dit: Si tu écoutes attentivement la voix de l'Éternel, ton Dieu, si tu fais ce qui est droit à ses yeux, si tu prêtes l'oreille à ses commandements, et si tu observes toutes ses lois, je ne te frapperai d'aucune des maladies dont j'ai frappé les Égyptiens; car je suis l'Éternel, qui te guérit.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que Jésus a porté mes souffrances et s'est chargé de mes maladies. À la croix, il a porté ce qui m'accablait afin que je reçoive sa vie. Je crois que son sacrifice est parfait et suffisant. Je place ma confiance en toi, mon Dieu qui guéris.",
                    declaration: "Je déclare que Jésus est mon guérisseur. Je déclare que mon espérance repose sur ses promesses. Je déclare que la puissance de Dieu agit dans tout mon être. Je déclare que je marche dans la paix, la foi et l'espérance.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que l'œuvre de la croix demeure efficace dans ma vie. Je proclame que toute maladie, toute infirmité et toute faiblesse doivent se soumettre à l'autorité de Jésus-Christ. Je proclame que la vie de Dieu agit dans mon corps. Je proclame que le Seigneur accomplit sa volonté parfaite en moi.",
                    priere: "Père céleste, Merci pour le sacrifice de Jésus. Merci parce qu'il a porté mes souffrances. Je reçois avec reconnaissance la grâce qui découle de son œuvre parfaite. Fortifie ma foi afin que je demeure ferme dans tes promesses. Au nom de Jésus-Christ. Amen.",
                    progression: "Je passe d'une foi basée sur les circonstances à une foi fondée sur l'œuvre accomplie de Jésus-Christ."
                },
                "THÈME 49 — PAR SES MEURTRISSURES JE SUIS GUÉRI": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 53:5</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Mais il était blessé pour nos péchés, Brisé pour nos iniquités; Le châtiment qui nous donne la paix est tombé sur lui, Et c'est par ses meurtrissures que nous sommes guéris.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 2:24</span>
                            <span class="verse-line"><span class="verse-num">24-</span>lui qui a porté lui-même nos péchés en son corps sur le bois, afin que morts aux péchés nous vivions pour la justice; lui par les meurtrissures duquel vous avez été guéris.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jérémie 17:14</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Guéris-moi, Éternel, et je serai guéri; Sauve-moi, et je serai sauvé; Car tu es ma gloire.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 107:20</span>
                            <span class="verse-line"><span class="verse-num">20-</span>Il envoya sa parole et les guérit, Il les fit échapper de la fosse.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Marc 5:34</span>
                            <span class="verse-line"><span class="verse-num">34-</span>Mais Jésus lui dit: Ma fille, ta foi t'a sauvée; va en paix, et sois guérie de ton mal.</span>
                        </div>
                    `,
                    confession: "Père céleste. Je confesse que par les meurtrissures de Jésus-Christ, j'ai reçu la guérison. Je crois que ta Parole est vérité. Je place ma confiance en ton amour, en ta fidélité et en ta puissance. Tu es le Dieu qui restaure entièrement.",
                    declaration: "Je déclare que la guérison de Dieu agit dans tout mon être. Je déclare que mon corps répond à la vie de Christ. Je déclare que mes forces sont renouvelées. Je déclare que la paix de Dieu garde mon cœur pendant tout le processus de restauration.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute atteinte à ma santé est soumise à l'autorité du Seigneur. Je proclame que la Parole de Dieu accomplit ce qu'elle déclare. Je proclame que la puissance du Saint-Esprit agit dans tout mon corps. Je proclame que Dieu est glorifié à travers ma vie.",
                    priere: "Seigneur, Merci pour les meurtrissures que tu as supportées par amour pour moi. Affermis ma confiance dans ta Parole. Apprends-moi à demeurer dans la paix pendant que tu accomplis ton œuvre. Je te rends gloire pour ta fidélité. Amen.",
                    progression: "Je fonde ma foi sur les promesses éternelles de Dieu plutôt que sur les circonstances visibles."
                },
                "THÈME 50 — MON CORPS APPARTIENT AU SEIGNEUR": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">1 Corinthiens 6:19-20</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Ne savez-vous pas que votre corps est le temple du Saint Esprit qui est en vous, que vous avez reçu de Dieu, et que vous ne vous appartenez point à vous-mêmes?</span>
                            <span class="verse-line"><span class="verse-num">20-</span>Car vous avez été rachetés à un grand prix. Glorifiez donc Dieu dans votre corps et dans votre esprit, qui appartiennent à Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 12:1</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Je vous exhorte donc, frères, par les compassions de Dieu, à offrir vos corps comme un sacrifice vivant, saint, agréable à Dieu, ce qui sera de votre part un culte raisonnable.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Thessaloniciens 5:23</span>
                            <span class="verse-line"><span class="verse-num">23-</span>Que le Dieu de paix vous sanctifie lui-même tout entiers, et que tout votre être, l'esprit, l'âme et le corps, soit conservé irrépréhensible, lors de l'avènement de notre Seigneur Jésus-Christ!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">3 Jean 2</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Bien-aimé, je souhaite que tu prospères à tous égards et sois en bonne santé, comme prospère l'état de ton âme.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 139:13-16</span>
                            <span class="verse-line"><span class="verse-num">13-</span>C'est toi qui as formé mes reins, Qui m'as tissé dans le sein de ma mère.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Je te loue de ce que je suis une créature si merveilleuse. Tes oeuvres sont admirables, Et mon âme le reconnaît bien.</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Mon corps n'était point caché devant toi, Lorsque j'ai été fait dans un lieu secret, Tissé dans les profondeurs de la terre.</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Quand je n'étais qu'une masse informe, tes yeux me voyaient; Et sur ton livre étaient tous inscrits Les jours qui m'étaient destinés, Avant qu'aucun d'eux existât.</span>
                        </div>
                    `,
                    confession: "Père céleste. Je confesse que mon corps t'appartient. J'ai été racheté à un grand prix par le sang de Jésus-Christ. Mon esprit, mon âme et mon corps sont consacrés à ton service. Je désire t'honorer dans toute ma manière de vivre.",
                    declaration: "Je déclare que mon corps est consacré au Seigneur. Je déclare que chaque organe, chaque cellule et chaque fonction de mon corps sont sous l'autorité de Jésus-Christ. Je déclare que je prends soin de ce temple avec sagesse. Je déclare que ma santé contribue à l'accomplissement de ma vocation.",
                    proclamation: "Au nom puissant de Jésus-Christ. Je proclame que mon corps est la propriété de Dieu. Je proclame que toute maladie doit se soumettre à l'autorité du Seigneur. Je proclame que la santé de Dieu est manifeste dans mes os, dans mes artères, dans mes cellules et dans mon esprit. Je proclame que je suis vivant, fort et productif pour la gloire du Seigneur.",
                    priere: "Père céleste, Merci parce que mon corps t'appartient. Apprends-moi à le respecter, à en prendre soin et à le consacrer entièrement à ton service. Que toute ma vie, dans mon esprit, mon âme et mon corps, rende gloire à Jésus-Christ. Amen.",
                    progression: "Je comprends que mon corps n'est pas seulement un instrument de la vie terrestre. Je le considère comme un dépôt sacré confié par Dieu pour accomplir sa volonté."
                },
                "THÈME 51 — DIEU RENOUVELLE MES FORCES": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 40:28-31</span>

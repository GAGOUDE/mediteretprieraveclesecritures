                            <span class="verse-line"><span class="verse-num">28-</span>Ne le sais-tu pas? ne l'as-tu pas appris? C'est le Dieu d'éternité, l'Éternel, Qui a créé les extrémités de la terre; Il ne se fatigue point, il ne se lasse point; On ne peut sonder son intelligence.</span>
                            <span class="verse-line"><span class="verse-num">29-</span>Il donne de la force à celui qui est fatigué, Et il augmente la vigueur de celui qui tombe en défaillance.</span>
                            <span class="verse-line"><span class="verse-num">30-</span>Les adolescents se fatiguent et se lassent, Et les jeunes hommes chancellent;</span>
                            <span class="verse-line"><span class="verse-num">31-</span>Mais ceux qui se confient en l'Éternel renouvellent leur force. Ils prennent le vol comme les aigles; Ils courent, et ne se lassent point, Ils marchent, et ne se fatiguent point.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 103:1-5</span>
                            <span class="verse-line"><span class="verse-num">1-</span>De David. Mon âme, bénis l'Éternel! Tout ce qui est en moi bénisse son saint nom!</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Mon âme, bénis l'Éternel, Et n'oublie aucun de ses bienfaits!</span>
                            <span class="verse-line"><span class="verse-num">3-</span>C'est lui qui pardonne toutes tes iniquités, Qui guérit toutes tes maladies;</span>
                            <span class="verse-line"><span class="verse-num">4-</span>C'est lui qui délivre ta vie de la fosse, Qui te couronne de bonté et de miséricorde;</span>
                            <span class="verse-line"><span class="verse-num">5-</span>C'est lui qui rassasie de biens ta vieillesse, Qui te fait rajeunir comme l'aigle.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 4:16</span>
                            <span class="verse-line"><span class="verse-num">16-</span>C'est pourquoi nous ne perdons pas courage. Et lors même que notre homme extérieur se détruit, notre homme intérieur se renouvelle de jour en jour.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 4:13</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Je puis tout par celui qui me fortifie.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Néhémie 8:10</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Ils leur dirent: Allez, mangez des viandes grasses et buvez des liqueurs douces, et envoyez des portions à ceux qui n'ont rien de préparé, car ce jour est consacré à notre Seigneur; ne vous affligez pas, car la joie de l'Éternel sera votre force.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu es le Dieu qui renouvelle mes forces. Lorsque je suis faible, tu me fortifies par ta puissance. Je crois que ceux qui se confient en toi renouvellent leur vigueur et marchent sans se fatiguer. Tu soutiens mon esprit, mon âme et mon corps.",
                    declaration: "Je déclare que mes forces sont renouvelées par le Seigneur. Je déclare que la joie du Seigneur est ma force. Je déclare que je suis fortifié intérieurement par le Saint-Esprit. Je déclare que Dieu me rend capable d'accomplir tout ce qu'il attend de moi.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que toute fatigue, tout découragement et tout épuisement doivent céder devant la puissance de Dieu. Je proclame que le Seigneur renouvelle mes forces comme celles de l'aigle. Je proclame que je marche avec endurance dans la volonté de Dieu. Je proclame que la puissance de Christ repose sur moi.",
                    priere: "Père céleste, Merci parce que tu es ma force. Lorsque je suis faible, relève-moi et renouvelle-moi. Donne-moi la persévérance pour accomplir fidèlement la mission que tu m'as confiée. Que je trouve chaque jour mon repos en toi. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse de dépendre uniquement de mes capacités naturelles. J'apprends à puiser continuellement ma force dans la présence de Dieu."
                },
                "THÈME 52 — DIEU EST MON REFUGE": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 46:1-2</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Au chef des chantres. Des fils de Koré. Sur alamoth. Cantique. Dieu est pour nous un refuge et un appui, Un secours qui ne manque jamais dans la détresse.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>C'est pourquoi nous sommes sans crainte quand la terre est bouleversée, Et que les montagnes chancellent au coeur des mers,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 91:1-2</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Celui qui demeure sous l'abri du Très-Haut Repose à l'ombre du Tout-Puissant.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Je dis à l'Éternel: Mon refuge et ma forteresse, Mon Dieu en qui je me confie!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 18:2-3</span>
                            <span class="verse-line"><span class="verse-num">2-</span>(18:3) Éternel, mon rocher, ma forteresse, mon libérateur! Mon Dieu, mon rocher, où je trouve un abri! Mon bouclier, la force qui me sauve, ma haute retraite!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Proverbes 18:10</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Le nom de l'Éternel est une tour forte; Le juste s'y réfugie, et se trouve en sûreté.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Nahum 1:7</span>
                            <span class="verse-line"><span class="verse-num">7-</span>L'Éternel est bon, Il est un refuge au jour de la détresse; Il connaît ceux qui se confient en lui.</span>
                        </div>
                    `,
                    confession: "Père céleste. Je confesse que tu es mon refuge et ma forteresse. Tu es mon abri dans les jours de détresse. Je place ma confiance en toi plutôt qu'en mes propres ressources. Je sais que tu ne m'abandonneras jamais.",
                    declaration: "Je déclare que Dieu est mon refuge. Je déclare que je demeure en sécurité sous sa protection. Je déclare que mon cœur ne sera pas dominé par la peur. Je déclare que le Seigneur combat pour moi.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que toute attaque dirigée contre ma vie se heurte à la protection du Dieu Tout-Puissant. Je proclame que le Seigneur est mon bouclier. Je proclame que sa fidélité m'entoure comme une muraille. Je proclame que je demeure dans la paix de Dieu.",
                    priere: "Père céleste, Merci parce que tu es mon refuge sûr. Apprends-moi à courir vers toi dans toutes les circonstances. Que mon cœur demeure ferme dans la confiance. Je me repose sous ta protection. Amen.",
                    progression: "Je cesse de chercher ma sécurité dans les choses de ce monde. Je trouve mon assurance dans la présence fidèle de Dieu."
                },
                "THÈME 53 — JE DEMEURE SOUS LES AILES DU TRÈS-HAUT": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 91</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Celui qui demeure sous l'abri du Très-Haut Repose à l'ombre du Tout-Puissant.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Je dis à l'Éternel: Mon refuge et ma forteresse, Mon Dieu en qui je me confie!</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Car c'est lui qui te délivre du filet de l'oiseleur, De la peste et de ses ravages.</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Il te couvrira de ses plumes, Et tu trouveras un refuge sous ses ailes; Sa fidélité est un bouclier et une cuirasse.</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Tu ne craindras ni les terreurs de la nuit, Ni la flèche qui vole de jour,</span>
                            <span class="verse-line"><span class="verse-num">6-</span>Ni la peste qui marche dans les ténèbres, Ni la contagion qui frappe en plein midi.</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Que mille tombent à ton côté, Et dix mille à ta droite, Tu ne seras pas atteint;</span>
                            <span class="verse-line"><span class="verse-num">8-</span>De tes yeux seulement tu regarderas, Et tu verras la rétribution des méchants.</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Car tu es mon refuge, ô Éternel! Tu fais du Très-Haut ta retraite.</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Aucun malheur ne t'arrivera, Aucun fléau n'approchera de ta tente.</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Car il ordonnera à ses anges De te garder dans toutes tes voies;</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Ils te porteront sur les mains, De peur que ton pied ne heurte contre une pierre.</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Tu marcheras sur le lion et sur l'aspic, Tu fouleras le lionceau et le dragon.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Puisqu'il m'aime, je le délivrerai; Je le protégerai, puisqu'il connaît mon nom.</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Il m'invoquera, et je lui répondrai; Je serai avec lui dans la détresse, Je le délivrerai et je le glorifierai.</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Je le rassasierai de longs jours, Et je lui ferai voir mon salut.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 57:2</span>
                            <span class="verse-line"><span class="verse-num">2-</span>(57:2) Aie pitié de moi, ô Dieu, aie pitié de moi! Car en toi mon âme cherche un refuge; Je cherche un refuge à l'ombre de tes ailes, Jusqu'à ce que les calamités soient passées.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 63:8</span>
                            <span class="verse-line"><span class="verse-num">8-</span>(63:9) Mon âme est attachée à toi; Ta droite me soutient.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Ruth 2:12</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Que l'Éternel te rende ce que tu as fait, et que ta récompense soit entière de la part de l'Éternel, le Dieu d'Israël, sous les ailes duquel tu es venue te réfugier!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 23:37</span>
                            <span class="verse-line"><span class="verse-num">37-</span>Jérusalem, Jérusalem, qui tues les prophètes et qui lapides ceux qui te sont envoyés, combien de fois ai-je voulu rassembler tes enfants, comme une poule rassemble ses poussins sous ses ailes, et vous ne l'avez pas voulu!</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que je demeure sous l'abri du Très-Haut. Je repose à l'ombre du Tout-Puissant. Ta fidélité est mon bouclier et ma cuirasse. Je demeure sous tes ailes où je trouve sécurité, paix et repos.",
                    declaration: "Je déclare que Dieu me couvre de sa protection. Je déclare que je demeure dans sa présence jour et nuit. Je déclare que sa fidélité m'accompagne partout. Je déclare que je suis gardé par l'amour du Père.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que je demeure sous la protection du Très-Haut. Je proclame qu'aucun piège de l'ennemi ne pourra prévaloir contre moi. Je proclame que Dieu me garde dans toutes mes voies. Je proclame que sa paix règne dans ma vie.",
                    priere: "Père céleste, Merci parce que tu me caches sous tes ailes. Apprends-moi à demeurer constamment dans ta présence. Que ma confiance en toi grandisse chaque jour. Je me repose dans ton amour. Amen.",
                    progression: "Je passe d'une vie gouvernée par l'inquiétude à une vie de repos dans la présence de Dieu."
                },
                "THÈME 54 — LES ANGES DE DIEU ME GARDENT": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 91:11-12</span>
                            <span class="verse-line"><span class="verse-num">11-</span>Car il ordonnera à ses anges De te garder dans toutes tes voies;</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Ils te porteront sur les mains, De peur que ton pied ne heurte contre une pierre.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 1:13-14</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Et auquel des anges a-t-il jamais dit: Assieds-toi à ma droite, jusqu'à ce que je fasse de tes ennemis ton marchepied?</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Ne sont-ils pas tous des esprits au service de Dieu, envoyés pour exercer un ministère en faveur de ceux qui doivent hériter du salut?</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 34:8</span>
                            <span class="verse-line"><span class="verse-num">8-</span>(34:9) Sentez et voyez combien l'Éternel est bon! Heureux l'homme qui cherche en lui son refuge!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 18:10</span>
                            <span class="verse-line"><span class="verse-num">10-</span>Gardez-vous de mépriser un seul de ces petits; car je vous dis que leurs anges dans les cieux voient continuellement la face de mon Père qui est dans les cieux.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu donnes des ordres à tes anges à mon sujet. Tu les envoies pour servir ceux qui doivent hériter du salut. Je te remercie pour ta protection invisible. Ma confiance repose en toi, et non dans les anges eux-mêmes.",
                    declaration: "Je déclare que Dieu veille continuellement sur moi. Je déclare que sa protection m'entoure. Je déclare que je marche en sécurité dans les voies que Dieu a préparées. Je déclare que le Seigneur me délivre de tout piège.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que Dieu ordonne à ses anges de me garder selon sa volonté. Je proclame que toute embûche de l'ennemi est déjouée. Je proclame que le Seigneur est mon protecteur. Je proclame que je marche dans la paix et dans la sécurité que Dieu accorde.",
                    priere: "Père céleste, Merci pour ta protection fidèle. Merci pour le ministère de tes anges qui accomplissent tes ordres. Aide-moi à vivre dans une confiance totale envers toi. Que je demeure toujours sous ta garde. Amen.",
                    progression: "Je ne vis plus dans la peur de l'invisible. Je vis dans l'assurance que Dieu veille continuellement sur ses enfants."
                },
                "THÈME 55 — AUCUNE ARME FORGÉE CONTRE MOI NE PROSPÉRERA": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 54:17</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Toute arme forgée contre toi sera sans effet; Et toute langue qui s'élèvera en justice contre toi, tu la condamneras. Tel est l'héritage des serviteurs de l'Éternel, Tel est le salut qui leur viendra de moi, dit l'Éternel.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Luc 10:19</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Voici, je vous ai donné le pouvoir de marcher sur les serpents et les scorpions, et sur toute la puissance de l'ennemi; et rien ne pourra vous nuire.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:31-39</span>
                            <span class="verse-line"><span class="verse-num">31-</span>Que dirons-nous donc à l'égard de ces choses? Si Dieu est pour nous, qui sera contre nous?</span>
                            <span class="verse-line"><span class="verse-num">32-</span>Lui, qui n'a point épargné son propre Fils, mais qui l'a livré pour nous tous, comment ne nous donnera-t-il pas aussi toutes choses avec lui?</span>
                            <span class="verse-line"><span class="verse-num">33-</span>Qui accusera les élus de Dieu? C'est Dieu qui justifie!</span>
                            <span class="verse-line"><span class="verse-num">34-</span>Qui les condamnera? Christ est mort; bien plus, il est ressuscité, il est à la droite de Dieu, et il intercède pour nous!</span>
                            <span class="verse-line"><span class="verse-num">35-</span>Qui nous séparera de l'amour de Christ? Sera-ce la tribulation, ou l'angoisse, ou la persécution, ou la faim, ou la nudité, ou le péril, ou l'épée?</span>
                            <span class="verse-line"><span class="verse-num">36-</span>selon qu'il est écrit: C'est à cause de toi qu'on nous met à mort tout le jour, Qu'on nous regarde comme des brebis destinées à la boucherie.</span>
                            <span class="verse-line"><span class="verse-num">37-</span>Mais dans toutes ces choses nous sommes plus que vainqueurs par celui qui nous a aimés.</span>
                            <span class="verse-line"><span class="verse-num">38-</span>Car j'ai l'assurance que ni la mort ni la vie, ni les anges ni les dominations, ni les choses présentes ni les choses à venir,</span>
                            <span class="verse-line"><span class="verse-num">39-</span>ni les puissances, ni la hauteur, ni la profondeur, ni aucune autre créature ne pourra nous séparer de l'amour de Dieu manifesté en Jésus Christ notre Seigneur.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 27:1-3</span>
                            <span class="verse-line"><span class="verse-num">1-</span>De David. L'Éternel est ma lumière et mon salut: De qui aurais-je crainte? L'Éternel est le soutien de ma vie: De qui aurais-je peur?</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Quand des méchants s'avancent contre moi, Pour dévorer ma chair, Ce sont mes persécuteurs et mes ennemis Qui chancellent et tombent.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Si une armée se campait contre moi, Mon coeur n'aurait aucune crainte; Si une guerre s'élevait contre moi, Je serais malgré cela plein de confiance.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse qu'aucune arme forgée contre moi ne prospérera. Tu es mon défenseur, mon bouclier et mon libérateur. Je crois que tu fais concourir toutes choses à mon bien. Aucune attaque ne pourra annuler les desseins que tu as pour ma vie.",
                    declaration: "Je déclare que je suis protégé par le Seigneur. Je déclare que toute accusation mensongère est réduite au silence. Je déclare que Dieu me garde dans sa fidélité. Je déclare que la victoire de Jésus est ma protection.",
                    proclamation: "Au nom puissant de Jésus-Christ, Je proclame que toute arme spirituelle, physique, psychologique ou relationnelle dirigée contre moi est sans effet devant l'autorité de Jésus-Christ. Je proclame que toute parole de malédiction, toute accusation, toute œuvre des ténèbres et tout projet inspiré par l'ennemi sont rendus impuissants par le sang de Jésus-Christ. Je proclame que le Seigneur est mon défenseur, que le Saint-Esprit est mon protecteur et que les promesses de Dieu sont mon héritage. Je proclame que je demeure ferme, victorieux et inébranlable, parce que mon héritage est en Jésus-Christ.",
                    priere: "Père céleste, Merci parce que tu es mon protecteur fidèle. Je remets entre tes mains ma vie, ma famille, mon ministère, mon travail et tout ce que tu m'as confié. Apprends-moi à demeurer dans la foi et dans l'obéissance afin de vivre sous ta protection. Que toute la gloire te revienne, au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse d'être gouverné par la peur des attaques de l'ennemi. Je développe une confiance inébranlable dans la souveraineté de Dieu, dans la puissance du sang de Jésus-Christ et dans les promesses immuables de sa Parole."
                },
                "THÈME 56 — LE SEIGNEUR COMBAT POUR MOI": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Exode 14:13-14</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Moïse répondit au peuple: Ne craignez rien, restez en place, et regardez la délivrance que l'Éternel va vous accorder en ce jour; car les Égyptiens que vous voyez aujourd'hui, vous ne les verrez plus jamais.</span>
                            <span class="verse-line"><span class="verse-num">14-</span>L'Éternel combattra pour vous; et vous, gardez le silence.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Deutéronome 1:30</span>
                            <span class="verse-line"><span class="verse-num">30-</span>L'Éternel, votre Dieu, qui marche devant vous, combattra lui-même pour vous, selon tout ce qu'il a fait pour vous sous vos yeux en Égypte,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Deutéronome 20:4</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Car l'Éternel, votre Dieu, marche avec vous, pour combattre vos ennemis, pour vous sauver.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">2 Chroniques 20:15-17</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Et Jachaziel dit: Soyez attentifs, tout Juda et habitants de Jérusalem, et toi, roi Josaphat! Ainsi vous parle l'Éternel: Ne craignez point et ne vous effrayez point devant cette multitude nombreuse, car ce ne sera pas vous qui combattrez, ce sera Dieu.</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Demain, descendez contre eux; ils vont monter par la colline de Tsits, et vous les trouverez à l'extrémité de la vallée, en face du désert de Jeruel.</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Vous n'aurez point à combattre en cette affaire: présentez-vous, tenez-vous là, et vous verrez la délivrance que l'Éternel vous accordera. Juda et Jérusalem, ne craignez point et ne vous effrayez point, demain, sortez à leur rencontre, et l'Éternel sera avec vous!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:31</span>
                            <span class="verse-line"><span class="verse-num">31-</span>Que dirons-nous donc à l'égard de ces choses? Si Dieu est pour nous, qui sera contre nous?</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu es le Dieu qui combat pour moi. Je n'ai pas à craindre les ennemis visibles ou invisibles, car tu marches devant moi. Je crois que mes victoires ne reposent pas sur ma propre force, mais sur ta puissance. Tu es mon Défenseur, mon Bouclier et mon Libérateur.",
                    declaration: "Je déclare que Dieu combat toutes les batailles que je lui remets. Je déclare que le Seigneur renverse les projets de l'ennemi contre ma vie.",
                    proclamation: "Au nom puissant de Jésus-Christ, Je proclame que toute œuvre des ténèbres dirigée contre moi est renversée par la puissance de Dieu. Je proclame que le Seigneur combat pour ma famille, ma santé, mon travail, mon ministère et ma destinée. Je proclame que les armes de l'ennemi sont sans effet devant le Dieu Tout-Puissant. Je proclame que la victoire du Seigneur se manifeste dans tous les domaines de ma vie.",
                    priere: "Père céleste, Merci parce que tu combats pour tes enfants. Apprends-moi à demeurer dans la foi lorsque les combats se présentent. Donne-moi un cœur paisible qui s'appuie sur tes promesses. Que toute la gloire te revienne. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse de vouloir tout résoudre par mes propres forces. J'apprends à remettre mes combats entre les mains du Seigneur et à marcher dans la paix."
                },
                "THÈME 57 — DIEU POURVOIT À TOUS MES BESOINS": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 4:19</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Et mon Dieu pourvoira à tous vos besoins selon sa richesse, avec gloire, en Jésus Christ.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 6:25-34</span>
                            <span class="verse-line"><span class="verse-num">25-</span>C'est pourquoi je vous dis: Ne vous inquiétez pas pour votre vie de ce que vous mangerez, ni pour votre corps, de quoi vous serez vêtus. La vie n'est-elle pas plus que la nourriture, et le corps plus que le vêtement?</span>
                            <span class="verse-line"><span class="verse-num">26-</span>Regardez les oiseaux du ciel: ils ne sèment ni ne moissonnent, et ils n'amassent rien dans des greniers; et votre Père céleste les nourrit. Ne valez-vous pas beaucoup plus qu'eux?</span>
                            <span class="verse-line"><span class="verse-num">27-</span>Qui de vous, par ses inquiétudes, peut ajouter une coudée à la durée de sa vie?</span>
                            <span class="verse-line"><span class="verse-num">28-</span>Et pourquoi vous inquiéter au sujet du vêtement? Considérez comment croissent les lis des champs: ils ne travaillent ni ne filent;</span>
                            <span class="verse-line"><span class="verse-num">29-</span>cependant je vous dis que Salomon même, dans toute sa gloire, n'a pas été vêtu comme l'un d'eux.</span>
                            <span class="verse-line"><span class="verse-num">30-</span>Si Dieu revêt ainsi l'herbe des champs, qui existe aujourd'hui et qui demain sera jetée au four, ne vous vêtira-t-il pas à plus forte raison, gens de peu de foi?</span>
                            <span class="verse-line"><span class="verse-num">31-</span>Ne vous inquiétez donc point, et ne dites pas: Que mangerons-nous? que boirons-nous? de quoi serons-nous vêtus?</span>
                            <span class="verse-line"><span class="verse-num">32-</span>Car toutes ces choses, ce sont les païens qui les recherchent. Votre Père céleste sait que vous en avez besoin.</span>
                            <span class="verse-line"><span class="verse-num">33-</span>Cherchez premièrement le royaume et la justice de Dieu; et toutes ces choses vous seront données par-dessus.</span>
                            <span class="verse-line"><span class="verse-num">34-</span>Ne vous inquiétez donc pas du lendemain; car le lendemain aura soin de lui-même. A chaque jour suffit sa peine.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 23:1</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Cantique de David. L'Éternel est mon berger: je ne manquerai de rien.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Genèse 22:14</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Abraham donna à ce lieu le nom de Jehova Jiré. C'est pourquoi l'on dit aujourd'hui: A la montagne de l'Éternel il sera pourvu.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu es Jéhovah-Jiré, le Dieu qui pourvoit. Tu connais chacun de mes besoins avant même que je te les expose. Je crois que tu pourvois à tous mes besoins selon ta richesse avec gloire en Jésus-Christ. Je choisis de te faire confiance.",
                    declaration: "Je déclare que Dieu prend soin de moi. Je déclare que je ne manquerai d'aucun bien nécessaire à l'accomplissement de sa volonté. Je déclare que mon Père céleste ouvre les bonnes portes en son temps.",
                    proclamation: "Au nom puissant de Jésus-Christ, Je proclame que toute crainte du manque quitte ma vie. Je proclame que Dieu ouvre les écluses de sa bénédiction selon sa volonté. Je proclame que toutes les ressources nécessaires à ma mission me seront accordées. Je proclame que le Seigneur est fidèle à chacune de ses promesses.",
                    priere: "Père céleste, Merci parce que tu prends soin de moi. Apprends-moi à rechercher premièrement ton Royaume et ta justice. Donne-moi un cœur reconnaissant dans l'abondance comme dans l'attente. Que je sois aussi un canal de bénédiction pour les autres. Au nom de Jésus-Christ. Amen.",
                    progression: "Je passe de l'inquiétude à la confiance. J'apprends à dépendre du Père qui connaît parfaitement tous mes besoins."
                }
            },
            // ============================================================
            // PARTIE VII — MA MISSION ET MON ESPÉRANCE (Thèmes 58 à 68)
            // ============================================================
            "PARTIE VII — MA MISSION ET MON ESPÉRANCE": {
                "THÈME 58 — JE SUIS LA LUMIÈRE DU MONDE": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 5:14-16</span>
                            <span class="verse-line"><span class="verse-num">14-</span>Vous êtes la lumière du monde. Une ville située sur une montagne ne peut être cachée;</span>
                            <span class="verse-line"><span class="verse-num">15-</span>et on n'allume pas une lampe pour la mettre sous le boisseau, mais on la met sur le chandelier, et elle éclaire tous ceux qui sont dans la maison.</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Que votre lumière luise ainsi devant les hommes, afin qu'ils voient vos bonnes oeuvres, et qu'ils glorifient votre Père qui est dans les cieux.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 2:15</span>
                            <span class="verse-line"><span class="verse-num">15-</span>afin que vous soyez irréprochables et purs, des enfants de Dieu irrépréhensibles au milieu d'une génération perverse et corrompue, parmi laquelle vous brillez comme des flambeaux dans le monde,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 5:8</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Autrefois vous étiez ténèbres, et maintenant vous êtes lumière dans le Seigneur. Marchez comme des enfants de lumière!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 8:12</span>
                            <span class="verse-line"><span class="verse-num">12-</span>Jésus leur parla de nouveau, et dit: Je suis la lumière du monde; celui qui me suit ne marchera pas dans les ténèbres, mais il aura la lumière de la vie.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 60:1-3</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Lève-toi, sois éclairée, car ta lumière arrive, Et la gloire de l'Éternel se lève sur toi.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Voici, les ténèbres couvrent la terre, Et l'obscurité les peuples; Mais sur toi l'Éternel se lève, Sur toi sa gloire apparaît.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Des nations marchent à ta lumière, Et des rois à la clarté de tes rayons.</span>
                        </div>
                    `,
                    confession: "Père céleste. Je confesse que, par Jésus-Christ, je suis appelé à être la lumière du monde. Tu m'as fait passer des ténèbres à ton admirable lumière. Je crois que ma vie est appelée à refléter la lumière de Christ. Je veux glorifier ton nom par ma conduite.",
                    declaration: "Je déclare que la lumière de Jésus brille à travers moi. Je déclare que mes paroles, mes pensées et mes actions glorifient Dieu. Je déclare que là où règnent les ténèbres, Christ se manifeste par ma vie. Je marche dans la lumière du Seigneur.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute obscurité spirituelle recule devant la lumière de Christ en moi. Je proclame que Dieu m'utilise pour éclairer ceux qui sont dans les ténèbres. Je proclame que ma vie attire les hommes vers Jésus-Christ. Je proclame que Dieu est glorifié à travers mon témoignage.",
                    priere: "Père céleste, Fais de moi une lumière dans ce monde. Que ma vie reflète ton amour, ta sainteté et ta vérité. Donne-moi le courage de témoigner fidèlement de Jésus. Que toute ma vie rende gloire à ton nom. Amen.",
                    progression: "Je comprends que ma vie n'est pas seulement destinée à être bénie. Elle est appelée à éclairer les autres et à conduire les hommes vers Jésus-Christ."
                },
                "THÈME 59 — JE SUIS LE SEL DE LA TERRE": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 5:13</span>
                            <span class="verse-line"><span class="verse-num">13-</span>Vous êtes le sel de la terre. Si le sel perd sa saveur, avec quoi la lui rendra-t-on? Il ne sert plus qu'à être jeté dehors, et foulé aux pieds par les hommes.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Marc 9:50</span>
                            <span class="verse-line"><span class="verse-num">50-</span>Le sel est une bonne chose; mais si le sel devient sans saveur, avec quoi l'assaisonnerez-vous? Ayez du sel en vous-mêmes, et soyez en paix les uns avec les autres.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 4:6</span>
                            <span class="verse-line"><span class="verse-num">6-</span>Que votre parole soit toujours accompagnée de grâce, assaisonnée de sel, afin que vous sachiez comment il faut répondre à chacun.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 2:15-16</span>
                            <span class="verse-line"><span class="verse-num">15-</span>afin que vous soyez irréprochables et purs, des enfants de Dieu irrépréhensibles au milieu d'une génération perverse et corrompue, parmi laquelle vous brillez comme des flambeaux dans le monde,</span>
                            <span class="verse-line"><span class="verse-num">16-</span>portant la parole de vie; et je pourrai me glorifier, au jour de Christ, de n'avoir pas couru en vain ni travaillé en vain.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Tite 2:7-8</span>
                            <span class="verse-line"><span class="verse-num">7-</span>te montrant toi-même à tous égards un modèle de bonnes œuvres, et donnant un enseignement pur, digne,</span>
                            <span class="verse-line"><span class="verse-num">8-</span>une parole saine, irréprochable, afin que l'adversaire soit confus, n'ayant aucun mal à dire de nous.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as établi comme le sel de la terre. Par ta grâce, je suis appelé à préserver, à purifier et à donner soif de toi. Je veux vivre d'une manière qui honore ton nom. Que ma vie influence ce monde pour ta gloire.",
                    declaration: "Je déclare que Dieu m'utilise comme une influence bénéfique. Je déclare que mes paroles communiquent la grâce. Je déclare que ma vie reflète la sainteté de Jésus-Christ. Je déclare que je demeure fidèle à ma vocation.",
                    proclamation: "Au nom de Jésus-Christ, Je proclame que ma vie ne perdra pas sa saveur spirituelle. Je proclame que Dieu me garde dans la vérité. Je proclame que mon influence contribuera à faire avancer le Royaume de Dieu.",
                    priere: "Père céleste, Préserve-moi de toute compromission. Aide-moi à demeurer fidèle à ta Parole. Que ma vie inspire les autres à rechercher Jésus-Christ. Que ton nom soit glorifié à travers mon témoignage. Amen.",
                    progression: "Je cesse de vivre uniquement pour moi-même. Je comprends que Dieu m'a établi pour influencer ce monde par le caractère de Christ."
                },
                "THÈME 60 — JE SUIS AMBASSADEUR DE CHRIST": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">2 Corinthiens 5:17-21</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Si quelqu'un est en Christ, il est une nouvelle créature. Les choses anciennes sont passées; voici, toutes choses sont devenues nouvelles.</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Et tout cela vient de Dieu, qui nous a réconciliés avec lui par Christ, et qui nous a donné le ministère de la réconciliation.</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Car Dieu était en Christ, réconciliant le monde avec lui-même, en n'imputant point aux hommes leurs offenses, et il a mis en nous la parole de la réconciliation.</span>
                            <span class="verse-line"><span class="verse-num">20-</span>Nous faisons donc les fonctions d'ambassadeurs pour Christ, comme si Dieu exhortait par nous; nous vous en supplions au nom de Christ: Soyez réconciliés avec Dieu!</span>
                            <span class="verse-line"><span class="verse-num">21-</span>Celui qui n'a point connu le péché, il l'a fait devenir péché pour nous, afin que nous devenions en lui justice de Dieu.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 28:18-20</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Jésus, s'étant approché, leur parla ainsi: Tout pouvoir m'a été donné dans le ciel et sur la terre.</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Allez, faites de toutes les nations des disciples, les baptisant au nom du Père, du Fils et du Saint Esprit,</span>
                            <span class="verse-line"><span class="verse-num">20-</span>et enseignez-leur à observer tout ce que je vous ai prescrit. Et voici, je suis avec vous tous les jours, jusqu'à la fin du monde.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Actes 1:8</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Mais vous recevrez une puissance, le Saint Esprit survenant sur vous, et vous serez mes témoins à Jérusalem, dans toute la Judée, dans la Samarie, et jusqu'aux extrémités de la terre.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Éphésiens 6:19-20</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Priez pour moi, afin qu'il me soit donné, quand j'ouvre la bouche, de faire connaître hardiment et librement le mystère de l'Évangile,</span>
                            <span class="verse-line"><span class="verse-num">20-</span>pour lequel je suis ambassadeur dans les chaînes, et que j'en parle avec assurance comme je dois en parler.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">1 Pierre 2:9</span>
                            <span class="verse-line"><span class="verse-num">9-</span>Vous, au contraire, vous êtes une race élue, un sacerdoce royal, une nation sainte, un peuple acquis, afin que vous annonciez les vertus de celui qui vous a appelés des ténèbres à son admirable lumière,</span>
                        </div>
                    `,
                    confession: "Père céleste. Je confesse que tu m'as établi ambassadeur de Jésus-Christ. Je représente ton Royaume sur la terre. Tu m'as confié le ministère de la réconciliation afin d'annoncer l'Évangile. Je veux être un témoin fidèle de mon Seigneur.",
                    declaration: "Je déclare que ma vie représente Jésus-Christ. Je déclare que le Saint-Esprit me donne les paroles justes. Je déclare que je témoigne avec amour, sagesse et puissance. Je déclare que Dieu se sert de moi pour attirer des hommes à Christ.",
                    proclamation: "Au nom puissant de Jésus-Christ, Je proclame que toute crainte de témoigner disparaît. Je proclame que le Saint-Esprit me remplit d'assurance et de sagesse. Je proclame que des portes s'ouvrent pour l'annonce de l'Évangile. Je proclame que des vies sont transformées par la puissance de Jésus-Christ à travers mon témoignage.",
                    priere: "Père céleste, Merci pour l'honneur de représenter ton Royaume. Remplis-moi d'amour pour les âmes perdues. Donne-moi l'audace, la compassion et la sagesse nécessaires pour annoncer fidèlement Jésus-Christ. Que toute ma vie soit un témoignage vivant de ton Évangile. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse de considérer la foi comme une expérience uniquement personnelle. Je comprends que Dieu m'envoie comme représentant de son Royaume afin de manifester Jésus-Christ partout où je suis."
                },
                "THÈME 61 — JE SUIS APPELÉ À PORTER DU FRUIT": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Jean 15:1-8</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Je suis le vrai cep, et mon Père est le vigneron.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Tout sarment qui est en moi et qui ne porte pas de fruit, il le retranche; et tout sarment qui porte du fruit, il l'émonde, afin qu'il porte encore plus de fruit.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Déjà vous êtes purs, à cause de la parole que je vous ai annoncée.</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Demeurez en moi, et je demeurerai en vous. Comme le sarment ne peut de lui-même porter du fruit, s'il ne demeure attaché au cep, ainsi vous ne le pouvez non plus, si vous ne demeurez en moi.</span>
                            <span class="verse-line"><span class="verse-num">5-</span>Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire.</span>
                            <span class="verse-line"><span class="verse-num">6-</span>Si quelqu'un ne demeure pas en moi, il est jeté dehors, comme le sarment, et il sèche; puis on ramasse les sarments, on les jette au feu, et ils brûlent.</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Si vous demeurez en moi, et que mes paroles demeurent en vous, demandez ce que vous voudrez, et cela vous sera accordé.</span>
                            <span class="verse-line"><span class="verse-num">8-</span>Si vous portez beaucoup de fruit, c'est ainsi que mon Père sera glorifié, et que vous serez mes disciples.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Colossiens 1:10</span>
                            <span class="verse-line"><span class="verse-num">10-</span>pour marcher d'une manière digne du Seigneur et lui être entièrement agréables, portant des fruits en toutes sortes de bonnes œuvres et croissant par la connaissance de Dieu,</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 7:17-20</span>
                            <span class="verse-line"><span class="verse-num">17-</span>Tout bon arbre porte de bons fruits, mais le mauvais arbre porte de mauvais fruits.</span>
                            <span class="verse-line"><span class="verse-num">18-</span>Un bon arbre ne peut porter de mauvais fruits, ni un mauvais arbre porter de bons fruits.</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Tout arbre qui ne porte pas de bons fruits est coupé et jeté au feu.</span>
                            <span class="verse-line"><span class="verse-num">20-</span>C'est donc à leurs fruits que vous les reconnaîtrez.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 1:1-3</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Heureux l'homme qui ne marche pas selon le conseil des méchants, Qui ne s'arrête pas sur la voie des pécheurs, Et qui ne s'assied pas en compagnie des moqueurs,</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Mais qui trouve son plaisir dans la loi de l'Éternel, Et qui la médite jour et nuit!</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Il est comme un arbre planté près d'un courant d'eau, Qui donne son fruit en sa saison, Et dont le feuillage ne se flétrit point: Tout ce qu'il fait lui réussit.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Philippiens 1:11</span>
                            <span class="verse-line"><span class="verse-num">11-</span>remplis du fruit de justice qui est par Jésus Christ, à la gloire et à la louange de Dieu.</span>
                        </div>
                    `,
                    confession: "Père céleste, Je confesse que tu m'as appelé à porter beaucoup de fruit. Parce que je demeure en Jésus-Christ, le véritable Cep, ta vie coule en moi et produit un fruit qui demeure. Je crois que tu me rends fécond pour ta gloire.",
                    declaration: "Je déclare que ma vie porte un fruit abondant. Je déclare que mes œuvres glorifient Dieu. Je déclare que le Seigneur me rend utile dans son Royaume. Je déclare que ma vie bénit les générations.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute stérilité spirituelle est brisée. Je proclame que la vie de Christ produit en moi un fruit durable. Je proclame que tout ce que Dieu a planté en moi arrive à maturité. Je proclame que ma vie glorifie le Père.",
                    priere: "Père céleste. Émonde-moi afin que je porte davantage de fruit. Apprends-moi à demeurer constamment en Jésus-Christ. Que toute ma vie produise des œuvres qui demeurent jusque dans l'éternité. Au nom de Jésus-Christ. Amen.",
                    progression: "Je ne cherche plus seulement à recevoir des bénédictions. Je désire désormais produire un fruit qui glorifie Dieu et bénit les autres."
                },
                "THÈME 62 — JE SUIS APPELÉ À MANIFESTER LA GLOIRE DE DIEU": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Ésaïe 60:1-3</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Lève-toi, sois éclairée, car ta lumière arrive, Et la gloire de l'Éternel se lève sur toi.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Voici, les ténèbres couvrent la terre, Et l'obscurité les peuples; Mais sur toi l'Éternel se lève, Sur toi sa gloire apparaît.</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Des nations marchent à ta lumière, Et des rois à la clarté de tes rayons.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Matthieu 5:16</span>
                            <span class="verse-line"><span class="verse-num">16-</span>Que votre lumière luise ainsi devant les hommes, afin qu'ils voient vos bonnes oeuvres, et qu'ils glorifient votre Père qui est dans les cieux.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Jean 17:22-23</span>
                            <span class="verse-line"><span class="verse-num">22-</span>Et moi, je leur ai donné la gloire que tu m'as donnée, pour qu'ils soient un comme nous, nous sommes un,</span>
                            <span class="verse-line"><span class="verse-num">23-</span>moi en eux et toi en moi, pour qu'ils soient accomplis dans l'unité et que le monde sache que c'est toi qui m'as envoyé et que tu les as aimés comme tu m'as aimé.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Romains 8:18-19</span>
                            <span class="verse-line"><span class="verse-num">18-</span>J'estime que les souffrances du temps présent ne sauraient être comparées à la gloire à venir qui sera révélée pour nous.</span>
                            <span class="verse-line"><span class="verse-num">19-</span>Aussi la création attend-elle avec un ardent désir la révélation des fils de Dieu.</span>
                        </div>
                    `,
                    confession: "Père céleste. Je confesse que tu m'as créé pour manifester ta gloire. Par Jésus-Christ, tu me transformes de gloire en gloire. Je crois que ma vie doit révéler ton caractère, ta puissance et ton amour.",
                    declaration: "Je déclare que la gloire de Dieu se manifeste dans ma vie. Je déclare que Christ est vu à travers mes paroles et mes actions. Je déclare que le Saint-Esprit me transforme chaque jour. Je déclare que toute la gloire revient au Seigneur.",
                    proclamation: "Au nom de Jésus-Christ. Je proclame que toute œuvre qui cherche à ternir le témoignage de Christ dans ma vie est détruite. Je proclame que la lumière de Dieu brille au travers de moi. Je proclame que les œuvres de Dieu sont manifestées dans ma vie. Je proclame que Jésus est glorifié en moi.",
                    priere: "Père céleste. Transforme-moi à l'image de ton Fils. Que toute ma vie reflète ta gloire. Utilise-moi afin que les hommes te connaissent et te glorifient. Au nom de Jésus-Christ. Amen.",
                    progression: "Je cesse de rechercher ma propre gloire. Je vis désormais afin que Jésus-Christ soit glorifié en toutes choses."
                },
                "THÈME 63 — JE SUIS UN ADORATEUR EN ESPRIT ET EN VÉRITÉ": {
                    versets: `
                        <div class="verse-block">
                            <span class="verse-ref">Jean 4:23-24</span>
                            <span class="verse-line"><span class="verse-num">23-</span>Mais l'heure vient, et elle est déjà venue, où les vrais adorateurs adoreront le Père en esprit et en vérité; car ce sont là les adorateurs que le Père demande.</span>
                            <span class="verse-line"><span class="verse-num">24-</span>Dieu est Esprit, et il faut que ceux qui l'adorent l'adorent en esprit et en vérité.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Hébreux 13:15</span>
                            <span class="verse-line"><span class="verse-num">15-</span>Par lui, offrons sans cesse à Dieu un sacrifice de louange, c'est-à-dire le fruit de lèvres qui confessent son nom.</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 95:1-7</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Venez, chantons avec allégresse à l'Éternel! Poussons des cris de joie vers le rocher de notre salut.</span>
                            <span class="verse-line"><span class="verse-num">2-</span>Allons au-devant de lui avec des louanges, Faisons retentir des cantiques en son honneur!</span>
                            <span class="verse-line"><span class="verse-num">3-</span>Car l'Éternel est un grand Dieu, Il est un grand roi au-dessus de tous les dieux.</span>
                            <span class="verse-line"><span class="verse-num">4-</span>Il tient dans sa main les profondeurs de la terre, Et les sommets des montagnes sont à lui.</span>
                            <span class="verse-line"><span class="verse-num">5-</span>La mer est à lui, c'est lui qui l'a faite; La terre aussi, ses mains l'ont formée.</span>
                            <span class="verse-line"><span class="verse-num">6-</span>Venez, prosternons-nous et humilions-nous, Fléchissons le genou devant l'Éternel, notre créateur!</span>
                            <span class="verse-line"><span class="verse-num">7-</span>Car il est notre Dieu, Et nous sommes le peuple de son pâturage, Le troupeau que sa main conduit… Oh! Si vous pouviez écouter aujourd'hui sa voix!</span>
                        </div>
                        <div class="verse-block">
                            <span class="verse-ref">Psaume 100</span>
                            <span class="verse-line"><span class="verse-num">1-</span>Psaume de louange. Poussez vers l'Éternel des cris de joie, Vous tous, habitants de la terre!</span>

        const partSelect = document.getElementById('part-select');
        const themeSelect = document.getElementById('theme-select');
        const contentArea = document.getElementById('content-area');
        const partKeys = Object.keys(DATA);

        function populateParts() {
            partSelect.innerHTML = '<option value="">— Choisissez une partie —</option>';
            partKeys.forEach(part => {
                const opt = document.createElement('option');
                opt.value = part;
                opt.textContent = part;
                partSelect.appendChild(opt);
            });
        }

        function populateThemes(partKey) {
            themeSelect.disabled = false;
            themeSelect.innerHTML = '<option value="">Sélectionnez un thème</option>';
            if (!partKey || !DATA[partKey]) {
                themeSelect.disabled = true;
                themeSelect.innerHTML = '<option value="">Sélectionnez d\'abord une partie</option>';
                return;
            }
            const themes = Object.keys(DATA[partKey]);
            themes.forEach(theme => {
                const opt = document.createElement('option');
                opt.value = theme;
                opt.textContent = theme;
                themeSelect.appendChild(opt);
            });
        }

        function renderContent(partKey, themeKey) {
            if (!partKey || !themeKey || !DATA[partKey] || !DATA[partKey][themeKey]) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#597d97" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16v16H4z" /><path d="M9 9h6v6H9z" /><path d="M9 15l2-2 2 2" /><path d="M9 9l2 2 2-2" />
                        </svg>
                        <h3>Sélectionnez une partie et un thème</h3>
                        <p style="margin-top:8px; max-width:360px; margin-left:auto; margin-right:auto;">Choisissez une partie dans le menu déroulant, puis un thème pour afficher les confessions, proclamations et prières.</p>
                    </div>
                `;
                return;
            }

            const data = DATA[partKey][themeKey];
            const hasPlaceholder = data.versets.includes('[Versets à compléter]');

            let versetsHtml = data.versets;
            if (hasPlaceholder) {
                versetsHtml = `<div class="placeholder-notice">⚠️ Certains versets de ce thème ne sont pas encore complétés.</div>` + versetsHtml;
            }

            const html = `
                <div class="content-section">
                    <div class="theme-title">${themeKey}</div>
                    <div class="theme-part">${partKey}</div>

                    <h3>📖 Références bibliques (LSG)</h3>
                    <div class="verses-container">${versetsHtml}</div>

                    <h3>🙌 Confession de foi</h3>
                    <div class="block-text">${data.confession}</div>

                    <h3>📢 Déclaration spirituelle</h3>
                    <div class="block-text">${data.declaration}</div>

                    <h3>⚔️ Proclamation d'autorité</h3>
                    <div class="block-text">${data.proclamation}</div>

                    <h3>🕊️ Prière</h3>
                    <div class="prayer-box">${data.priere}</div>

                    <h3>📈 Progression spirituelle</h3>
                    <div class="spiritual-progress">${data.progression}</div>
                </div>
            `;

            contentArea.innerHTML = html;
            contentArea.style.animation = 'none';
            requestAnimationFrame(() => {
                contentArea.style.animation = 'fadeIn 0.25s ease-out';
            });
        }

        partSelect.addEventListener('change', function() {
            const part = this.value;
            populateThemes(part);
            if (!part) {
                renderContent(null, null);
            } else {
                const themes = Object.keys(DATA[part] || {});
                if (themes.length > 0) {
                    themeSelect.value = themes[0];
                    renderContent(part, themes[0]);
                } else {
                    renderContent(part, null);
                }
            }
        });

        themeSelect.addEventListener('change', function() {
            const part = partSelect.value;
            const theme = this.value;
            if (part && theme) {
                renderContent(part, theme);
            } else {
                renderContent(part, null);
            }
        });

        populateParts();
        renderContent(null, null);
    })();
</script>

</body>
</html>
